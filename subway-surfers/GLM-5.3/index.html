<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10162A">
<title>Subway Dash — Endless Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    background:radial-gradient(120% 120% at 50% 0%, #1E2A4A 0%, #10162A 55%, #0A0E1C 100%);
    display:flex;align-items:center;justify-content:center;
  }
  canvas{
    display:block;
    max-width:min(400px,100vw);
    max-height:min(700px,100dvh);
    width:auto;height:auto;
    border-radius:18px;
    box-shadow:0 24px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
    touch-action:none;
  }
</style>
</head>
<body>
<canvas id="game" width="400" height="700"></canvas>
<script>
'use strict';

const W=400,H=700,HORIZON=185,BASE_Y=645,FOCAL=95,Z_FAR=1900,Z_SPAWN=1750;
const LANES=[-125,0,125];
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const DPR=Math.min(window.devicePixelRatio||1,2);
cv.width=W*DPR;cv.height=H*DPR;ctx.scale(DPR,DPR);
if(document.fonts&&document.fonts.load){document.fonts.load('700 20px Fredoka');}

const rand=(a,b)=>a+Math.random()*(b-a);
const irand=(a,b)=>Math.floor(rand(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;
function roundRect(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
const fnt=(w,s)=>`${w} ${s}px Fredoka, "Segoe UI", system-ui, sans-serif`;
const persp=z=>FOCAL/(FOCAL+Math.max(z,-FOCAL+1));
const gY=z=>HORIZON+(BASE_Y-HORIZON)*persp(z);
const sX=(x,z)=>W/2+x*persp(z);

let state='menu';
let dist=0,scroll=0,speed=170,nextSpawn=0,score=0,coinsGot=0,newBest=false;
let best=0;try{best=+(localStorage.getItem('subway-dash-best')||0);}catch(e){}
let shake=0,flash=0,transIn=1,hintT=0,overT=0,menuT=0,time=0;

const player={lane:1,x:0,jy:0,vy:0,grounded:true,slideT:0,runT:0,tilt:0,crashRot:0,wantSlide:false};
let obstacles=[],coins=[],particles=[],buildings=[],lamps=[],clouds=[];
let skyFar=null,skyMid=null;

const SPB=350,LSP=300;
const BUILD_COLORS=[['#FF9B7A','#E87B58'],['#FFD98E','#E8B86A'],['#8ADBC8','#63B8A4'],['#9CC3F0','#7AA3D8'],['#F2A9C8','#D888AB'],['#C9E49A','#A8C47A']];
const TRAINC=[['#E85A4F','#C6483C','#F7C9A0'],['#4F8FE8','#3E72BE','#A8D0F5'],['#57C08A','#419B6B','#B8E9CF'],['#F2A13C','#CC822B','#FBE0AE']];

function genSkyline(hMin,hMax){
  const arr=[];let x=0;
  while(x<900){
    const w=irand(34,70),h=irand(hMin,hMax);
    arr.push({x,w,h,ant:Math.random()<.3});
    x+=w+irand(6,18);
  }
  return{arr,span:x};
}
function makeBuilding(side,z){
  const [c,cd]=BUILD_COLORS[irand(0,BUILD_COLORS.length-1)];
  return{side,z,xo:rand(295,375),w:rand(160,250),h:rand(190,470),c,cd,
    cols:irand(3,6),rows:irand(5,10),seed:Math.floor(Math.random()*97),awning:Math.random()<.5};
}
function initWorld(){
  skyFar=genSkyline(42,102);skyMid=genSkyline(72,158);
  clouds=[];for(let i=0;i<5;i++)clouds.push({x:rand(0,W),y:rand(36,130),s:rand(.75,1.55),v:rand(4,10)});
  buildings=[];for(const side of[-1,1])for(let i=0;i<7;i++)buildings.push(makeBuilding(side,i*SPB+rand(0,120)));
  lamps=[];for(const side of[-1,1])for(let i=0;i<7;i++)lamps.push({side,z:i*LSP+rand(0,80)});
}

let AC=null;
function initAudio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function tone(f0,f1,dur,type,vol,delay){
  if(!AC)return;
  const t0=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;
  o.frequency.setValueAtTime(f0,t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t0+dur);
  g.gain.setValueAtTime(vol,t0);
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g);g.connect(AC.destination);
  o.start(t0);o.stop(t0+dur+.02);
}
const sfx={
  coin(){tone(950,950,.09,'sine',.10);tone(1425,1425,.12,'sine',.10,.06);},
  jump(){tone(250,540,.14,'square',.05);},
  slide(){tone(240,90,.16,'triangle',.06);},
  crash(){tone(190,45,.4,'sawtooth',.16);tone(120,38,.5,'square',.12);},
  start(){tone(440,440,.08,'sine',.07);tone(660,660,.1,'sine',.07,.09);},
  lane(){tone(320,390,.06,'sine',.04);}
};

function dust(n){
  const px=W/2+player.x;
  for(let i=0;i<n;i++)particles.push({x:px+rand(-14,14),y:646+rand(-3,3),vx:rand(-60,60),vy:rand(-140,-30),life:rand(.25,.5),t:0,type:'puff',r:rand(2.5,6)});
}
function sparkle(c){
  const s=persp(c.z),px=sX(LANES[c.lane],c.z),py=gY(c.z)-(c.y+10)*s;
  for(let i=0;i<7;i++)particles.push({x:px,y:py,vx:rand(-120,120),vy:rand(-160,40),life:.35,t:0,type:'spark',r:rand(1.5,3),col:'#FFD766'});
}
function crash(){
  state='over';overT=0;shake=1;flash=.9;player.crashRot=0;
  sfx.crash();
  const px=W/2+player.x;
  for(let i=0;i<26;i++)particles.push({x:px+rand(-20,20),y:rand(560,640),vx:rand(-260,260),vy:rand(-360,-40),life:rand(.4,.8),t:0,type:'spark',r:rand(2,4.5),col:Math.random()<.5?'#FFB13D':'#FF5D45'});
  newBest=score>best;
  if(newBest){best=score;try{localStorage.setItem('subway-dash-best',best);}catch(e){}}
}
function startGame(){
  obstacles=[];coins=[];particles=[];
  dist=0;speed=430;nextSpawn=900;score=0;coinsGot=0;
  shake=0;flash=0;transIn=1;hintT=0;newBest=false;
  Object.assign(player,{lane:1,x:0,jy:0,vy:0,grounded:true,slideT:0,tilt:0,crashRot:0,wantSlide:false});
  state='playing';
  sfx.start();
}
function advanceFromScreens(){
  if(state==='menu')startGame();
  else if(state==='over'&&overT>.45)startGame();
}

function moveLane(d){
  const nl=clamp(player.lane+d,0,2);
  if(nl!==player.lane){player.lane=nl;sfx.lane();}
}
function doJump(){
  if(player.grounded){player.vy=800;player.grounded=false;player.slideT=0;sfx.jump();dust(6);}
}
function doSlide(){
  if(player.grounded){player.slideT=.72;sfx.slide();}
  else{player.vy=-1500;player.wantSlide=true;}
}

window.addEventListener('keydown',e=>{
  const k=e.key;
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k))e.preventDefault();
  if(e.repeat)return;
  initAudio();
  if(state!=='playing'){
    if(k===' '||k==='Enter')advanceFromScreens();
    return;
  }
  if(k==='ArrowLeft'||k==='a'||k==='A')moveLane(-1);
  else if(k==='ArrowRight'||k==='d'||k==='D')moveLane(1);
  else if(k===' '||k==='ArrowUp'||k==='w'||k==='W')doJump();
  else if(k==='ArrowDown'||k==='s'||k==='S')doSlide();
});

let tS=null;
cv.addEventListener('touchstart',e=>{
  e.preventDefault();initAudio();
  const t=e.changedTouches[0];
  tS={x:t.clientX,y:t.clientY,fired:false};
},{passive:false});
cv.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(!tS||tS.fired)return;
  const t=e.changedTouches[0];
  const dx=t.clientX-tS.x,dy=t.clientY-tS.y;
  if(Math.hypot(dx,dy)<20)return;
  tS.fired=true;
  if(state!=='playing'){advanceFromScreens();return;}
  if(Math.abs(dx)>Math.abs(dy))moveLane(dx>0?1:-1);
  else dy<0?doJump():doSlide();
},{passive:false});
cv.addEventListener('touchend',e=>{
  e.preventDefault();
  if(tS&&!tS.fired){
    if(state!=='playing')advanceFromScreens();
    else doJump();
  }
  tS=null;
},{passive:false});
cv.addEventListener('mousedown',()=>{initAudio();if(state!=='playing')advanceFromScreens();});
cv.addEventListener('contextmenu',e=>e.preventDefault());

function coinArc(lane,zc){
  const hs=[42,86,118,86,42];
  for(let i=0;i<5;i++)coins.push({lane,z:zc-116+i*58,y:hs[i]});
}
function spawnPattern(){
  const d=dist,r=Math.random();
  const lanes=[0,1,2];
  const pick=a=>a.splice(irand(0,a.length-1),1)[0];
  let extent=220;
  if(r<.16){
    const l=pick(lanes),n=irand(6,9);
    for(let i=0;i<n;i++)coins.push({lane:l,z:Z_SPAWN+i*58,y:32});
    if(Math.random()<.5){const l2=pick(lanes);for(let i=0;i<4;i++)coins.push({lane:l2,z:Z_SPAWN+80+i*58,y:26});}
    extent=n*58;
  }else if(r<.36){
    const bl=pick(lanes);
    obstacles.push({type:'low',lane:bl,z:Z_SPAWN,len:40});
    coinArc(bl,Z_SPAWN+18);
    if(d>2500&&Math.random()<.5){obstacles.push({type:'low',lane:pick(lanes),z:Z_SPAWN+rand(60,140),len:40});}
    extent=260;
  }else if(r<.52){
    const l=pick(lanes);
    obstacles.push({type:'over',lane:l,z:Z_SPAWN,len:40});
    for(let i=0;i<5;i++)coins.push({lane:l,z:Z_SPAWN-70+i*58,y:28});
    if(d>3000&&Math.random()<.5){obstacles.push({type:'over',lane:pick(lanes),z:Z_SPAWN+rand(80,160),len:40});}
    extent=280;
  }else if(r<.78){
    let maxEnd=0;
    const l1=pick(lanes),len1=irand(380,640);
    obstacles.push({type:'train',lane:l1,z:Z_SPAWN,len:len1,v:irand(0,3)});
    maxEnd=Math.max(maxEnd,len1);
    if(d>1400&&Math.random()<.55){
      const off=rand(0,120),len2=irand(320,560);
      obstacles.push({type:'train',lane:pick(lanes),z:Z_SPAWN+off,len:len2,v:irand(0,3)});
      maxEnd=Math.max(maxEnd,off+len2);
    }
    const cl=lanes[irand(0,lanes.length-1)],n=Math.floor(len1/62);
    for(let i=0;i<n;i++)coins.push({lane:cl,z:Z_SPAWN+30+i*60,y:32});
    extent=maxEnd;
  }else if(r<.9){
    const la=pick(lanes),lb=pick(lanes),lc=lanes[0];
    obstacles.push({type:'low',lane:la,z:Z_SPAWN,len:40});
    obstacles.push({type:'over',lane:lb,z:Z_SPAWN+rand(90,180),len:40});
    for(let i=0;i<5;i++)coins.push({lane:lc,z:Z_SPAWN+i*58,y:32});
    extent=340;
  }else{
    const lt=pick(lanes),len=irand(360,520);
    obstacles.push({type:'train',lane:lt,z:Z_SPAWN,len,v:irand(0,3)});
    const bl=pick(lanes),lc=lanes[0];
    obstacles.push({type:'low',lane:bl,z:Z_SPAWN+rand(40,160),len:40});
    for(let i=0;i<6;i++)coins.push({lane:lc,z:Z_SPAWN+40+i*60,y:32});
    extent=len+200;
  }
  return extent;
}

function advanceWorld(adv){
  for(const o of obstacles)o.z-=adv;
  for(const c of coins)c.z-=adv;
  for(const b of buildings){b.z-=adv;if(b.z<-180)b.z+=7*SPB;}
  for(const L of lamps){L.z-=adv;if(L.z<-140)L.z+=7*LSP;}
}
function updateParticles(dt){
  for(const p of particles){
    p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.type==='spark')p.vy+=700*dt;
    if(p.type==='puff')p.vy-=60*dt;
  }
  particles=particles.filter(p=>p.t<p.life);
}

function update(dt){
  time+=dt;
  for(const c of clouds){c.x-=c.v*dt;if(c.x<-90)c.x=W+90;}
  if(state==='menu'){
    menuT+=dt;speed=170;
    scroll+=speed*dt;
    advanceWorld(speed*dt);
    player.runT+=dt*11;
    updateParticles(dt);
    return;
  }
  if(state==='over'){
    overT+=dt;
    shake=Math.max(0,shake-dt*2.2);
    flash=Math.max(0,flash-dt*2.5);
    player.crashRot=Math.min(1.25,player.crashRot+dt*3.4);
    updateParticles(dt);
    return;
  }
  speed=Math.min(940,speed+dt*10);
  hintT+=dt;transIn=Math.max(0,transIn-dt*3);
  const adv=speed*dt;
  dist+=adv;scroll+=adv;
  score=Math.floor(dist*.06)+coinsGot*15;
  while(dist>nextSpawn){
    const ext=spawnPattern();
    const gapBase=lerp(360,210,clamp(dist/9000,0,1));
    nextSpawn=dist+ext+gapBase+rand(0,140);
  }
  const targetX=LANES[player.lane];
  const dx0=targetX-player.x;
  player.x+=dx0*Math.min(1,dt*14);
  player.tilt=lerp(player.tilt,clamp(dx0*.012,-.4,.4),Math.min(1,dt*10));
  if(!player.grounded){
    player.vy-=2500*dt;
    player.jy+=player.vy*dt;
    if(player.jy<=0){
      player.jy=0;player.grounded=true;dust(8);
      if(player.wantSlide){player.wantSlide=false;player.slideT=.6;sfx.slide();}
    }
  }
  if(player.slideT>0){
    player.slideT-=dt;
    if(Math.random()<dt*40)dust(1);
  }
  player.runT+=dt*(9+speed*.004);
  advanceWorld(adv);
  const pz0=-26,pz1=26;
  for(const o of obstacles){
    if(o.z>pz1||o.z+o.len<pz0)continue;
    const lc=LANES[o.lane];
    const hw=o.type==='train'?62:o.type==='low'?54:58;
    if(Math.abs(player.x-lc)>30+hw)continue;
    if(o.type==='low'){if(player.jy>52)continue;}
    else if(o.type==='over'){const top=player.jy+(player.slideT>0?42:86);if(top<=68)continue;}
    crash();break;
  }
  for(const c of coins){
    if(c.got)continue;
    if(Math.abs(c.z)<44&&Math.abs(player.x-LANES[c.lane])<62){
      const top=player.jy+(player.slideT>0?50:92);
      if(c.y+16>player.jy-8&&c.y-16<top){
        c.got=true;coinsGot++;sfx.coin();sparkle(c);
      }
    }
  }
  coins=coins.filter(c=>!c.got&&c.z>-60);
  obstacles=obstacles.filter(o=>o.z+o.len>-140);
  updateParticles(dt);
  if(speed>660&&Math.random()<dt*26){
    particles.push({x:Math.random()<.5?rand(6,70):rand(330,394),y:rand(HORIZON+40,560),vx:0,vy:rand(1200,1700),life:.22,t:0,type:'streak'});
  }
  shake=Math.max(0,shake-dt*3);
  flash=Math.max(0,flash-dt*3);
}

function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,HORIZON+30);
  g.addColorStop(0,'#3D9BE9');g.addColorStop(.45,'#7CC7F5');g.addColorStop(.8,'#C8ECFA');g.addColorStop(1,'#FFF6D8');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,HORIZON+30);
  const sg=ctx.createRadialGradient(318,82,4,318,82,74);
  sg.addColorStop(0,'rgba(255,244,190,.95)');sg.addColorStop(1,'rgba(255,244,190,0)');
  ctx.fillStyle=sg;ctx.fillRect(244,8,148,148);
  ctx.fillStyle='#FFF3A6';ctx.beginPath();ctx.arc(318,82,20,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.arc(312,76,6,0,TAU);ctx.fill();
  for(const c of clouds){
    ctx.fillStyle='rgba(255,255,255,.92)';
    const s=c.s;
    ctx.beginPath();
    ctx.ellipse(c.x,c.y,34*s,16*s,0,0,TAU);
    ctx.ellipse(c.x-22*s,c.y+6*s,20*s,12*s,0,0,TAU);
    ctx.ellipse(c.x+24*s,c.y+5*s,22*s,13*s,0,0,TAU);
    ctx.ellipse(c.x+2*s,c.y-10*s,20*s,12*s,0,0,TAU);
    ctx.fill();
  }
}
function drawSkyline(sk,par,col){
  const span=sk.span,off=(scroll*par)%span;
  ctx.fillStyle=col;
  for(let k=-1;k<=1;k++){
    for(const b of sk.arr){
      const x=b.x-off+k*span;
      if(x<-80||x>W+40)continue;
      ctx.fillRect(x,HORIZON-b.h,b.w,b.h+2);
      if(b.ant)ctx.fillRect(x+b.w/2-1,HORIZON-b.h-10,2,10);
    }
  }
}
function trackPath(hw){
  const zn=-20,zf=Z_FAR;
  ctx.beginPath();
  ctx.moveTo(sX(-hw,zn),gY(zn));
  ctx.lineTo(sX(hw,zn),gY(zn));
  ctx.lineTo(sX(hw,zf),gY(zf));
  ctx.lineTo(sX(-hw,zf),gY(zf));
  ctx.closePath();
}
function strip(x,wn,wf,color){
  const zn=-20,zf=1750;
  ctx.beginPath();
  ctx.moveTo(sX(x-wn,zn),gY(zn));
  ctx.lineTo(sX(x+wn,zn),gY(zn));
  ctx.lineTo(sX(x+wf,zf),gY(zf));
  ctx.lineTo(sX(x-wf,zf),gY(zf));
  ctx.closePath();
  ctx.fillStyle=color;ctx.fill();
}
function drawGround(){
  let g=ctx.createLinearGradient(0,HORIZON,0,H);
  g.addColorStop(0,'#AED694');g.addColorStop(.5,'#8CC973');g.addColorStop(1,'#6FB25A');
  ctx.fillStyle=g;ctx.fillRect(0,HORIZON,W,H-HORIZON);
  g=ctx.createLinearGradient(0,HORIZON,0,H);
  g.addColorStop(0,'#D8CCB6');g.addColorStop(1,'#A2917B');
  ctx.fillStyle=g;trackPath(190);ctx.fill();
  const SP=64;let idx=0;
  for(let z=-(scroll%SP);z<1600;z+=SP,idx++){
    if(z<-6)continue;
    const s=persp(z);if(s<.03)continue;
    const y=gY(z),th=Math.max(1.2,11*s);
    ctx.fillStyle=idx%2?'#8A6A4C':'#816348';
    ctx.fillRect(sX(-182,z),y-th/2,364*s,th);
  }
  for(const lx of LANES)for(const off of[-36,36]){
    strip(lx+off,3.2,.38,'#9AA3AD');
    strip(lx+off,1.4,.18,'#DFE6ED');
  }
  strip(-192,3,.45,'rgba(242,230,196,.85)');
  strip(192,3,.45,'rgba(242,230,196,.85)');
  ctx.fillStyle='rgba(240,248,255,.5)';ctx.fillRect(0,HORIZON-8,W,8);
  ctx.fillStyle='rgba(240,248,255,.22)';ctx.fillRect(0,HORIZON-18,W,10);
}
function drawBuilding(b){
  const s=persp(b.z);if(s<.02)return;
  const x=sX(b.side*b.xo,b.z),y=gY(b.z);
  const w=b.w*s,h=b.h*s;
  if(x+w/2<-40||x-w/2>W+40)return;
  ctx.fillStyle='rgba(25,45,25,.15)';
  ctx.beginPath();ctx.ellipse(x,y+2*s,w*.6,8*s,0,0,TAU);ctx.fill();
  ctx.fillStyle=b.c;ctx.fillRect(x-w/2,y-h,w,h);
  ctx.fillStyle=b.cd;
  if(b.side<0)ctx.fillRect(x+w/2-w*.13,y-h,w*.13,h);
  else ctx.fillRect(x-w/2,y-h,w*.13,h);
  ctx.fillRect(x-w/2,y-h,w,Math.max(2,7*s));
  const cols=b.cols,rows=b.rows;
  const gw=(w*.82)/cols,gh=(h*.7)/rows;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const lit=((r*31+c*17+b.seed)%4)===0;
    ctx.fillStyle=lit?'rgba(255,243,196,.92)':'rgba(66,80,108,.5)';

function draw(){
  ctx.save();
  if(shake>0)ctx.translate(rand(-1,1)*shake*10,rand(-1,1)*shake*8);
  drawSky();
  drawSkyline(skyFar,.012,'#BFCDF0');
  drawSkyline(skyMid,.03,'#97ABDB');
  drawGround();
  const items=[];
  for(const b of buildings)items.push({z:b.z,d:()=>drawBuilding(b)});
  for(const L of lamps)items.push({z:L.z,d:()=>drawLamp(L)});
  for(const o of obstacles)items.push({z:o.z+(o.type==='train'?o.len:0),d:()=>{
    if(o.type==='low')drawLow(o);
    else if(o.type==='over')drawOverSign(o);
    else drawTrain(o);
  }});
  for(const c of coins)items.push({z:c.z,d:()=>drawCoin(c)});
  items.sort((a,b)=>b.z-a.z);
  for(const it of items)it.d();
  drawPlayer();
  drawParticles();
  ctx.restore();
  drawVignette();
  if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*.55})`;ctx.fillRect(0,0,W,H);}
  if(state==='menu')drawMenu();
  else if(state==='over')drawGameOver();
  else drawHUD();
  if(transIn>0){ctx.fillStyle=`rgba(8,11,22,${transIn})`;ctx.fillRect(0,0,W,H);}
}

initWorld();
let last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,1/30);
  last=now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
