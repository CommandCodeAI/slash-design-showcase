<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05040e">
<title>Galaxy Shooter</title>
<style>
  :root {
    --ink: #05040e;
    --ice: #7ee8ff;
    --hot: #ff4d9a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #03020a;
    color: #d8f4ff;
    font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    display: grid;
    place-items: center;
    background:
      radial-gradient(120% 80% at 50% -10%, #1a1240 0%, #08061a 48%, #03020a 100%);
  }
  #wrap {
    position: relative;
    width: min(100vw, 400px);
    height: min(100dvh, 700px);
    aspect-ratio: 400 / 700;
    max-height: 100dvh;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 10px;
    box-shadow:
      0 0 0 1px rgba(126, 232, 255, .22),
      0 0 48px rgba(90, 80, 255, .18),
      0 24px 80px rgba(0, 0, 0, .7);
    touch-action: none;
  }
  .pad {
    position: absolute;
    bottom: max(12px, env(safe-area-inset-bottom));
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: 1.5px solid rgba(126, 232, 255, .42);
    background: rgba(10, 18, 48, .42);
    color: #9eeeff;
    font-size: 26px;
    display: grid;
    place-items: center;
    touch-action: none;
    text-shadow: 0 0 10px rgba(126, 232, 255, .8);
  }
  .pad:active, .pad.on {
    background: rgba(50, 140, 220, .5);
    transform: scale(.94);
  }
  #padL { left: 10px; }
  #padR { left: 90px; }
  #padF {
    right: 10px;
    width: 88px;
    border-radius: 18px;
    border-color: rgba(255, 77, 154, .5);
    color: #ffd0e8;
    letter-spacing: .14em;
    font-size: 13px;
    font-weight: 700;
    text-shadow: 0 0 10px rgba(255, 77, 154, .8);
  }
  #padF:active, #padF.on {
    background: rgba(180, 40, 110, .55);
  }
  #mute {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    border: 1px solid rgba(126, 232, 255, .28);
    background: rgba(8, 12, 32, .4);
    color: #9eeeff;
    font-size: 14px;
    display: grid;
    place-items: center;
    opacity: .7;
  }
  @media (hover: hover) and (pointer: fine) {
    #padL, #padR, #padF { opacity: .28; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="400" height="700"></canvas>
  <button class="pad" id="padL" type="button" aria-label="Move left">◀</button>
  <button class="pad" id="padR" type="button" aria-label="Move right">▶</button>
  <button class="pad" id="padF" type="button" aria-label="Fire">FIRE</button>
  <button id="mute" type="button" aria-label="Mute">♪</button>
</div>
<script>
(() => {
  "use strict";

  const cvs = document.getElementById("game");
  const ctx = cvs.getContext("2d", { alpha: false });
  const W = 400, H = 700;
  const TAU = Math.PI * 2;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cvs.width = W * dpr;
  cvs.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const rnd = (a, b) => a + Math.random() * (b - a);
  const rndi = (a, b) => (Math.random() * (b - a + 1) | 0) + a;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, k) => a + (b - a) * k;
  const dist2 = (a, b) => {
    const dx = a.x - b.x, dy = a.y - b.y;
    return dx * dx + dy * dy;
  };
  const hit = (a, b, r) => dist2(a, b) < r * r;

  const C = {
    ice: "#7ee8ff",
    hull: "#1c5ad4",
    wing: "#0b2d7a",
    hot: "#ff4d9a",
    lime: "#7dff6a",
    amber: "#ffb44a",
    violet: "#c86bff",
    rose: "#ff6b7a",
    ui: "#d8f4ff",
    dim: "#6d82b8"
  };

  let AC = null, master = null, muted = false;
  try { muted = localStorage.getItem("gs46_mute") === "1"; } catch (_) {}
  document.getElementById("mute").textContent = muted ? "×" : "♪";

  function audioInit() {
    if (AC) {
      if (AC.state === "suspended") AC.resume();
      return;
    }
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain();
      master.gain.value = 0.28;
      master.connect(AC.destination);
    } catch (_) { AC = null; }
  }
  function tone(freq, dur, type, vol, slide) {
    if (!AC || muted) return;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, AC.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), AC.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.16, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.connect(g); g.connect(master);
    o.start(); o.stop(AC.currentTime + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!AC || muted) return;
    const n = AC.createBufferSource();
    const len = Math.floor(AC.sampleRate * dur);
    const buf = AC.createBuffer(1, len, AC.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    n.buffer = buf;
    const f = AC.createBiquadFilter();
    f.type = "lowpass"; f.frequency.value = freq || 800;
    const g = AC.createGain();
    g.gain.value = vol || 0.22;
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    n.connect(f); f.connect(g); g.connect(master);
    n.start();
  }
  const SFX = {
    shoot() { tone(920, 0.05, "square", 0.04, 380); },
    hit() { tone(280, 0.05, "square", 0.07, 140); },
    boom() { noise(0.32, 0.28, 680); tone(130, 0.24, "sawtooth", 0.1, 48); },
    big() { noise(0.85, 0.42, 460); tone(80, 0.65, "sawtooth", 0.16, 28); },
    pick() { tone(700, 0.07, "triangle", 0.14, 1400); },
    hurt() { noise(0.35, 0.3, 360); tone(190, 0.3, "sawtooth", 0.16, 55); },
    level() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.12, "triangle", 0.12), i * 75)); },
    over() { [392, 330, 262, 196].forEach((f, i) => setTimeout(() => tone(f, 0.28, "sawtooth", 0.14, f * 0.6), i * 140)); },
    start() { [392, 523, 659, 784].forEach((f, i) => setTimeout(() => tone(f, 0.1, "triangle", 0.12), i * 70)); }
  };

  let state = "start";
  let score = 0, best = 0, lives = 3, level = 1, time = 0;
  let shake = 0, flash = 0, banner = 0, waveWait = 0, overT = 0, startT = 0;
  try { best = +localStorage.getItem("gs46_best") || 0; } catch (_) {}

  const player = {
    x: W / 2, y: H - 118, r: 13, spd: 310,
    cool: 0, power: 1, rapid: 0, shield: 0, inv: 0, tilt: 0
  };

  const bullets = [];
  const ebullets = [];
  const enemies = [];
  const pending = [];
  const drops = [];
  const parts = [];
  const pops = [];
  const form = { x: 0, y: 0, dir: 1, amp: 46, sp: 42, down: 8 };

  const stars = [];
  for (let i = 0; i < 90; i++) {
    const l = i < 40 ? 0 : i < 70 ? 1 : 2;
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      l,
      s: l === 0 ? 1 : l === 1 ? 1.4 : 2,
      v: l === 0 ? 18 : l === 1 ? 38 : 78,
      tw: Math.random() * TAU,
      h: Math.random()
    });
  }
  const nebula = [
    { x: 70, y: 160, r: 140, c: "90,50,180" },
    { x: 320, y: 90, r: 120, c: "180,40,130" },
    { x: 200, y: 420, r: 160, c: "30,70,160" }
  ];

  const keys = Object.create(null);
  let padL = false, padR = false, padF = false, dragX = null;

  function bindPad(el, set) {
    const on = e => { e.preventDefault(); set(true); el.classList.add("on"); audioInit(); };
    const off = e => { e.preventDefault(); set(false); el.classList.remove("on"); };
    el.addEventListener("pointerdown", on);
    el.addEventListener("pointerup", off);
    el.addEventListener("pointerleave", off);
    el.addEventListener("pointercancel", off);
  }
  bindPad(document.getElementById("padL"), v => padL = v);
  bindPad(document.getElementById("padR"), v => padR = v);
  bindPad(document.getElementById("padF"), v => padF = v);

  document.getElementById("mute").addEventListener("click", e => {
    e.stopPropagation();
    muted = !muted;
    document.getElementById("mute").textContent = muted ? "×" : "♪";
    try { localStorage.setItem("gs46_mute", muted ? "1" : "0"); } catch (_) {}
  });

  window.addEventListener("keydown", e => {
    keys[e.code] = true;
    if (["ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
    if (e.code === "Space" || e.code === "Enter") act();
    if (e.code === "KeyM") document.getElementById("mute").click();
    audioInit();
  });
  window.addEventListener("keyup", e => { keys[e.code] = false; });

  cvs.addEventListener("pointerdown", e => {
    audioInit();
    const r = cvs.getBoundingClientRect();
    const x = (e.clientX - r.left) * (W / r.width);
    const y = (e.clientY - r.top) * (H / r.height);
    if (state !== "play") { act(); return; }
    if (y < H - 150) dragX = x;
  });
  cvs.addEventListener("pointermove", e => {
    if (dragX === null) return;
    const r = cvs.getBoundingClientRect();
    dragX = (e.clientX - r.left) * (W / r.width);
  });
  window.addEventListener("pointerup", () => { dragX = null; });
  window.addEventListener("blur", () => { padL = padR = padF = false; dragX = null; });

  function act() {
    audioInit();
    if (state === "start") startGame();
    else if (state === "over" && overT > 0.6) startGame();
  }

  function startGame() {
    score = 0; lives = 3; level = 1;
    bullets.length = ebullets.length = enemies.length = pending.length = 0;
    drops.length = parts.length = pops.length = 0;
    Object.assign(player, {
      x: W / 2, y: H - 118, cool: 0, power: 1, rapid: 0, shield: 0, inv: 1.2, tilt: 0
    });
    form.x = 0; form.y = 0; form.dir = 1;
    state = "play";
    waveWait = 0;
    spawnWave();
    SFX.start();
  }

  function gameOver() {
    state = "over";
    overT = 0;
    if (score > best) {
      best = score;
      try { localStorage.setItem("gs46_best", String(best)); } catch (_) {}
    }
    SFX.over();
  }

  function mkEnemy(o) {
    return Object.assign({
      hitT: 0, enter: 0.55, enterDur: 0.55, shootT: rnd(1.2, 3.4),
      phase: rnd(0, TAU), sx: o.x, sy: -40
    }, o);
  }

  function spawnWave() {
    enemies.length = 0;
    pending.length = 0;
    form.x = 0; form.y = 0; form.dir = 1;
    form.sp = 36 + level * 3;
    form.down = 6 + level * 0.6;
    banner = 1.6;
    const boss = level % 5 === 0;
    if (boss) {
      pending.push({
        t: 0.4,
        make() {
          enemies.push(mkEnemy({
            type: "boss", mode: "boss",
            x: W / 2, y: 90, baseX: W / 2, baseY: 96,
            r: 28, hp: 28 + level * 6, maxhp: 28 + level * 6,
            color: C.violet, pts: 800 + level * 80, atk: 1.2, pat: 0
          }));
        }
      });
      return;
    }
    const kinds = [
      { type: "scout", color: C.hot, r: 12, hp: 1, pts: 80 },
      { type: "wasp", color: C.lime, r: 11, hp: 1, pts: 120 },
      { type: "bulk", color: C.amber, r: 16, hp: 3 + (level > 4 ? 1 : 0), pts: 220 },
      { type: "hunter", color: C.violet, r: 13, hp: 2, pts: 160 }
    ];
    const pattern = (level - 1) % 4;
    const rows = pattern === 3 ? 2 : 3;
    const cols = pattern === 1 ? 6 : 5;
    let n = 0;
    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        if (pattern === 0 && row === 0 && (col === 0 || col === cols - 1)) continue;
        if (pattern === 2 && row === 1 && col !== 0 && col !== cols - 1 && col !== (cols / 2 | 0)) continue;
        const k = kinds[(row + level) % (level < 3 ? 2 : kinds.length)];
        const bx = 56 + col * ((W - 112) / (cols - 1));
        const by = 72 + row * 48;
        const delay = n * 0.07;
        n++;
        pending.push({
          t: delay,
          make() {
            enemies.push(mkEnemy({
              type: k.type, mode: "form",
              x: bx, y: -30, baseX: bx, baseY: by,
              r: k.r, hp: k.hp, maxhp: k.hp, color: k.color, pts: k.pts
            }));
          }
        });
      }
    }
    if (level >= 2) {
      const extra = 1 + (level > 6 ? 1 : 0);
      for (let i = 0; i < extra; i++) {
        pending.push({
          t: 1.4 + i * 1.8,
          make() {
            const x = rnd(40, W - 40);
            enemies.push(mkEnemy({
              type: "wasp", mode: "dive",
              x, y: -20, baseX: x, baseY: 0, ox: x,
              r: 11, hp: 1, maxhp: 1, color: C.lime, pts: 150,
              enter: 0, vy: 140 + level * 8, amp: 46, freq: 2.1
            }));
          }
        });
      }
    }
  }

  function nextLevel() {
    level++;
    SFX.level();
    spawnWave();
  }

  function fire() {
    if (player.cool > 0) return;
    const rate = player.rapid > 0 ? 0.09 : 0.18;
    player.cool = rate / (1 + (player.power - 1) * 0.08);
    const dmg = 1;
    const mk = (ox, vx) => bullets.push({
      x: player.x + ox, y: player.y - 16, vx, vy: -520, r: 3.2, dmg, life: 1.4
    });
    if (player.power >= 3) { mk(-10, -30); mk(0, 0); mk(10, 30); }
    else if (player.power >= 2) { mk(-7, 0); mk(7, 0); }
    else mk(0, 0);
    SFX.shoot();
  }

  function enemyShot(e, ang, spd, r) {
    ebullets.push({
      x: e.x, y: e.y + 8,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      r: r || 4, life: 4
    });
  }
  function aimAt(e) {
    return Math.atan2(player.y - e.y, player.x - e.x);
  }

  function boom(x, y, color, s) {
    shake = Math.min(10, shake + 3 * s);
    flash = Math.max(flash, 0.08 * s);
    for (let i = 0; i < 10 * s + 8; i++) {
      const a = rnd(0, TAU), sp = rnd(40, 220) * s;
      parts.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: rnd(0.25, 0.55) * s, max: 0.55 * s,
        c: i % 3 ? color : "#fff", r: rnd(1.4, 3.4) * s, t: "p", drag: 0.9
      });
    }
    parts.push({ x, y, life: 0.28 * s, max: 0.28 * s, c: color, r: 18 * s, t: "ring" });
  }
  function spark(x, y, c, n) {
    for (let i = 0; i < n; i++) {
      const a = rnd(0, TAU), sp = rnd(30, 140);
      parts.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0.2, max: 0.2, c, r: 1.6, t: "p", drag: 0.88
      });
    }
  }
  function pop(x, y, txt, c) {
    pops.push({ x, y, txt, c, life: 0.7, max: 0.7 });
  }
  function maybeDrop(x, y, chance) {
    if (Math.random() > chance) return;
    const pool = ["P", "R", "S", "H"];
    const w = [0.38, 0.28, 0.22, 0.12];
    let r = Math.random(), k = "P";
    for (let i = 0; i < pool.length; i++) { r -= w[i]; if (r <= 0) { k = pool[i]; break; } }
    drops.push({ x, y, vy: 72, k, t: 0, r: 11 });
  }
  function applyDrop(d) {
    SFX.pick();
    pop(d.x, d.y, d.k === "H" ? "+LIFE" : d.k === "S" ? "SHIELD" : d.k === "R" ? "RAPID" : "POWER", C.ice);
    if (d.k === "P") player.power = Math.min(3, player.power + 1);
    else if (d.k === "R") player.rapid = Math.min(8, player.rapid + 5);
    else if (d.k === "S") player.shield = Math.min(8, player.shield + 5);
    else if (d.k === "H") lives = Math.min(5, lives + 1);
  }
  function damagePlayer() {
    if (player.inv > 0) return;
    if (player.shield > 0) {
      player.shield = 0;
      player.inv = 1;
      boom(player.x, player.y, C.ice, 0.8);
      SFX.hit();
      return;
    }
    lives--;
    player.inv = 1.6;
    player.power = Math.max(1, player.power - 1);
    boom(player.x, player.y, C.ice, 1.3);
    shake = 8;
    SFX.hurt();
    if (lives <= 0) gameOver();
  }

  function update(dt) {
    time += dt;
    shake = Math.max(0, shake - dt * 18);
    flash = Math.max(0, flash - dt);
    if (banner > 0) banner -= dt;
    startT += dt;

    for (const s of stars) {
      s.y += s.v * dt;
      s.tw += dt * 3;
      if (s.y > H) { s.y = -4; s.x = Math.random() * W; }
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt;
      if (p.t === "p") {
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.vx *= p.drag; p.vy *= p.drag; p.vy += 30 * dt;
      }
      if (p.life <= 0) parts.splice(i, 1);
    }
    for (let i = pops.length - 1; i >= 0; i--) {
      pops[i].life -= dt; pops[i].y -= 28 * dt;
      if (pops[i].life <= 0) pops.splice(i, 1);
    }

    if (state !== "play") {
      if (state === "over") overT += dt;
      return;
    }

    let mv = 0;
    if (keys.ArrowLeft || keys.KeyA || padL) mv -= 1;
    if (keys.ArrowRight || keys.KeyD || padR) mv += 1;
    if (dragX !== null) {
      const d = dragX - player.x;
      player.x += clamp(d, -player.spd * 1.6 * dt, player.spd * 1.6 * dt);
      mv = clamp(d / 40, -1, 1);
    } else {
      player.x += mv * player.spd * dt;
    }
    player.x = clamp(player.x, 18, W - 18);
    player.tilt = lerp(player.tilt, mv * 0.36, 1 - Math.pow(0.001, dt));
    player.cool -= dt;
    player.inv = Math.max(0, player.inv - dt);
    player.rapid = Math.max(0, player.rapid - dt);
    player.shield = Math.max(0, player.shield - dt);
    fire();
    if (Math.random() < dt * 36) {
      parts.push({
        x: player.x + rnd(-3, 3), y: player.y + 14,
        vx: rnd(-12, 12), vy: rnd(80, 140),
        life: 0.24, max: 0.24, c: C.ice, r: rnd(1, 2.2), t: "p", drag: 0.9
      });
    }

    for (let i = pending.length - 1; i >= 0; i--) {
      pending[i].t -= dt;
      if (pending[i].t <= 0) { pending[i].make(); pending.splice(i, 1); }
    }

    form.x += form.dir * form.sp * dt;
    if (form.x > form.amp) { form.x = form.amp; form.dir = -1; form.y += 5; }
    if (form.x < -form.amp) { form.x = -form.amp; form.dir = 1; form.y += 5; }
    form.y += form.down * dt;

    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      e.hitT = Math.max(0, e.hitT - dt);
      if (e.enter > 0) {
        e.enter -= dt;
        const k = 1 - Math.pow(clamp(e.enter / e.enterDur, 0, 1), 3);
        const tx = e.mode === "boss" ? e.baseX : e.baseX + form.x;
        const ty = e.mode === "boss" ? e.baseY : e.baseY + form.y;
        e.x = lerp(e.sx, tx, k);
        e.y = lerp(e.sy, ty, k);
      } else if (e.mode === "form") {
        e.x = e.baseX + form.x;
        e.y = e.baseY + form.y + Math.sin(time * 2 + e.phase) * 4;
      } else if (e.mode === "dive") {
        e.y += e.vy * dt;
        e.x = e.ox + Math.sin(e.y * 0.018 * e.freq + e.phase) * e.amp;
        e.x = clamp(e.x, 16, W - 16);
        if (e.y > H + 40) { enemies.splice(i, 1); continue; }
      } else if (e.mode === "boss") {
        e.x = W / 2 + Math.sin(time * 0.7) * 86;
        e.y = e.baseY + Math.sin(time * 1.2) * 10;
        e.atk -= dt;
        if (e.atk <= 0) {
          e.pat = (e.pat + 1) % 3;
          if (e.pat === 0) {
            for (let a = 0; a < 9; a++) enemyShot(e, Math.PI * 0.2 + a * (Math.PI * 0.6 / 8), 170, 5);
            e.atk = 1.45;
          } else if (e.pat === 1) {
            const a = aimAt(e);
            [-0.2, 0, 0.2].forEach(o => enemyShot(e, a + o, 250, 4.4));
            e.atk = 0.5;
          } else {
            for (let s = -1; s <= 1; s += 2) enemyShot(e, Math.PI / 2 + s * 0.48, 200, 5.5);
            e.atk = 0.85;
          }
        }
      }

      if (e.mode !== "boss" && e.enter <= 0) {
        e.shootT -= dt * (1 + level * 0.06);
        if (e.shootT <= 0) {
          e.shootT = rnd(2.1, 5.2) - Math.min(1.3, level * 0.1);
          if (e.y < H - 150) {
            if (e.type === "bulk") {
              const a = aimAt(e);
              [-0.28, 0, 0.28].forEach(o => enemyShot(e, a + o, 170, 5));
            } else if (e.type === "wasp") enemyShot(e, aimAt(e), 240, 3.6);
            else enemyShot(e, Math.PI / 2 + rnd(-0.2, 0.2), 190, 4);
          }
        }
      }

      if (e.mode === "form" && e.y > H - 70) {
        boom(e.x, e.y, e.color, 1);
        enemies.splice(i, 1);
        damagePlayer();
        continue;
      }
      if (player.inv <= 0 && hit(e, player, e.r + player.r)) {
        if (e.type !== "boss") { boom(e.x, e.y, e.color, 1.1); enemies.splice(i, 1); }
        damagePlayer();
      }
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      if (b.y < -20 || b.x < -20 || b.x > W + 20 || b.life <= 0) { bullets.splice(i, 1); continue; }
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        if (hit(b, e, e.r + b.r)) {
          e.hp -= b.dmg; e.hitT = 0.08;
          spark(b.x, b.y - 4, "#fff", 3);
          bullets.splice(i, 1);
          if (e.hp <= 0) {
            score += e.pts;
            pop(e.x, e.y, "+" + e.pts, e.color);
            if (e.type === "boss") {
              boom(e.x, e.y, e.color, 2.4);
              SFX.big();
              ["P", "S", "H"].forEach((k, n) => drops.push({ x: e.x + (n - 1) * 28, y: e.y, vy: 70, k, t: 0, r: 11 }));
            } else {
              boom(e.x, e.y, e.color, e.type === "bulk" ? 1.5 : 1);
              SFX.boom();
              maybeDrop(e.x, e.y, e.type === "bulk" ? 0.5 : 0.14);
            }
            enemies.splice(j, 1);
          } else SFX.hit();
          break;
        }
      }
    }

    for (let i = ebullets.length - 1; i >= 0; i--) {
      const b = ebullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      if (b.y > H + 24 || b.y < -24 || b.x < -24 || b.x > W + 24 || b.life <= 0) {
        ebullets.splice(i, 1); continue;
      }
      if (hit(b, player, player.r + b.r)) {
        ebullets.splice(i, 1);
        damagePlayer();
      }
    }

    for (let i = drops.length - 1; i >= 0; i--) {
      const d = drops[i];
      d.y += d.vy * dt; d.t += dt * 3;
      d.x += Math.sin(d.t) * 20 * dt;
      if (d.y > H + 20) { drops.splice(i, 1); continue; }
      if (hit(d, player, player.r + d.r + 4)) { applyDrop(d); drops.splice(i, 1); }
    }

    if (enemies.length === 0 && pending.length === 0) {
      waveWait += dt;
      if (waveWait > 1.05) { waveWait = 0; nextLevel(); }
    } else waveWait = 0;
  }

  function glow(color, blur) {
    ctx.shadowColor = color;
    ctx.shadowBlur = blur;
  }
  function noGlow() { ctx.shadowBlur = 0; }

  function drawBg() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0c1030");
    g.addColorStop(0.55, "#070614");
    g.addColorStop(1, "#04030c");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = "lighter";
    for (const n of nebula) {
      const rg = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
      rg.addColorStop(0, `rgba(${n.c},.11)`);
      rg.addColorStop(1, `rgba(${n.c},0)`);
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, TAU); ctx.fill();
    }
    for (const s of stars) {
      const a = (0.35 + s.l * 0.22) * (0.55 + 0.45 * Math.sin(s.tw));
      ctx.fillStyle = s.h < 0.18 ? `rgba(255,170,220,${a})`
        : s.h < 0.4 ? `rgba(170,220,255,${a})`
        : `rgba(255,255,255,${a})`;
      if (s.l === 2) ctx.fillRect(s.x, s.y, s.s, s.s * 3.4);
      else ctx.fillRect(s.x, s.y, s.s, s.s);
    }
    ctx.globalCompositeOperation = "source-over";
  }

  function drawPlayer() {
    const p = player;
    if (p.inv > 0 && (time * 20 | 0) % 2 === 0 && p.shield <= 0) return;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.tilt * 0.5);

    const fl = 12 + Math.sin(time * 28) * 4;
    const fg = ctx.createLinearGradient(0, 12, 0, 12 + fl);
    fg.addColorStop(0, "rgba(160,245,255,.95)");
    fg.addColorStop(1, "rgba(60,120,255,0)");
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.moveTo(-5, 12); ctx.lineTo(5, 12); ctx.lineTo(0, 12 + fl); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-11, 8); ctx.lineTo(-7, 8); ctx.lineTo(-9, 8 + fl * 0.6); ctx.fill();
    ctx.beginPath(); ctx.moveTo(11, 8); ctx.lineTo(7, 8); ctx.lineTo(9, 8 + fl * 0.6); ctx.fill();

    glow("rgba(80,190,255,.9)", 14);
    ctx.fillStyle = C.wing;
    ctx.beginPath();
    ctx.moveTo(0, -6); ctx.lineTo(16, 6); ctx.lineTo(13, 13); ctx.lineTo(0, 9);
    ctx.lineTo(-13, 13); ctx.lineTo(-16, 6); ctx.closePath(); ctx.fill();

    const hg = ctx.createLinearGradient(0, -18, 0, 14);
    hg.addColorStop(0, "#dff8ff");
    hg.addColorStop(0.45, C.ice);
    hg.addColorStop(1, C.hull);
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.moveTo(0, -18); ctx.lineTo(8, 4); ctx.lineTo(4, 14); ctx.lineTo(-4, 14); ctx.lineTo(-8, 4);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = "#9ad4ff";
    ctx.beginPath(); ctx.moveTo(-10, 2); ctx.lineTo(-18, 10); ctx.lineTo(-8, 10); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(10, 2); ctx.lineTo(18, 10); ctx.lineTo(8, 10); ctx.closePath(); ctx.fill();

    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.ellipse(0, -4, 3.2, 4.4, 0, 0, TAU); ctx.fill();
    noGlow();

    if (p.shield > 0) {
      ctx.strokeStyle = `rgba(90,255,220,${0.45 + 0.3 * Math.sin(time * 8)})`;
      ctx.lineWidth = 2;
      glow("#5affd0", 10);
      ctx.beginPath(); ctx.arc(0, 0, 22, 0, TAU); ctx.stroke();
      noGlow();
    }
    ctx.restore();
  }

  function drawEnemy(e) {
    ctx.save();
    ctx.translate(e.x, e.y);
    if (e.hitT > 0) ctx.globalAlpha = 0.55;
    glow(e.color, 12);
    ctx.fillStyle = e.color;
    if (e.type === "boss") {
      ctx.beginPath();
      ctx.moveTo(0, -26); ctx.lineTo(24, -8); ctx.lineTo(20, 18);
      ctx.lineTo(0, 12); ctx.lineTo(-20, 18); ctx.lineTo(-24, -8);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#1a1028";
      ctx.beginPath(); ctx.ellipse(0, -4, 8, 7, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(-6, -6, 2.4, 0, TAU); ctx.arc(6, -6, 2.4, 0, TAU); ctx.fill();
      const w = 44, h = 4;
      ctx.fillStyle = "rgba(0,0,0,.45)";
      ctx.fillRect(-w / 2, 22, w, h);
      ctx.fillStyle = C.hot;
      ctx.fillRect(-w / 2, 22, w * clamp(e.hp / e.maxhp, 0, 1), h);
    } else if (e.type === "bulk") {
      ctx.beginPath();
      ctx.moveTo(-14, -8); ctx.lineTo(14, -8); ctx.lineTo(16, 10); ctx.lineTo(0, 16); ctx.lineTo(-16, 10);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#2a1808";
      ctx.fillRect(-6, -4, 12, 8);
    } else if (e.type === "wasp") {
      ctx.beginPath();
      ctx.moveTo(0, 12); ctx.lineTo(12, -8); ctx.lineTo(0, -4); ctx.lineTo(-12, -8);
      ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(0, -2, 4, 0, TAU); ctx.fill();
    } else if (e.type === "hunter") {
      ctx.beginPath();
      ctx.moveTo(0, -14); ctx.lineTo(12, 4); ctx.lineTo(6, 12); ctx.lineTo(-6, 12); ctx.lineTo(-12, 4);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#1a0820";
      ctx.beginPath(); ctx.arc(0, 0, 3.4, 0, TAU); ctx.fill();
    } else {
      ctx.beginPath();
      ctx.moveTo(-11, -6); ctx.lineTo(11, -6); ctx.lineTo(8, 10); ctx.lineTo(0, 6); ctx.lineTo(-8, 10);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-14, 0); ctx.lineTo(-8, -2); ctx.lineTo(-8, 6); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(14, 0); ctx.lineTo(8, -2); ctx.lineTo(8, 6); ctx.closePath(); ctx.fill();
    }
    noGlow();
    ctx.restore();
  }

  function drawHud() {
    ctx.save();
    ctx.font = "700 11px ui-sans-serif, system-ui, sans-serif";
    ctx.fillStyle = C.dim;
    ctx.letterSpacing = "0.14em";
    ctx.fillText("SCORE", 14, 22);
    ctx.fillText("LEVEL", W / 2 - 16, 22);
    ctx.textAlign = "right";
    ctx.fillText("LIVES", W - 14, 22);
    ctx.letterSpacing = "0";
    ctx.textAlign = "left";
    ctx.font = "700 20px ui-sans-serif, system-ui, sans-serif";
    ctx.fillStyle = C.ui;
    glow(C.ice, 8);
    ctx.fillText(String(score).padStart(6, "0"), 14, 44);
    ctx.textAlign = "center";
    ctx.fillText(String(level), W / 2, 44);
    noGlow();
    ctx.textAlign = "right";
    for (let i = 0; i < lives; i++) {
      const x = W - 18 - i * 18, y = 36;
      ctx.fillStyle = C.hot;
      glow(C.hot, 8);
      ctx.beginPath();
      ctx.moveTo(x, y + 4);
      ctx.bezierCurveTo(x, y - 2, x - 8, y - 2, x - 8, y + 3);
      ctx.bezierCurveTo(x - 8, y + 8, x, y + 12, x, y + 14);
      ctx.bezierCurveTo(x, y + 12, x + 8, y + 8, x + 8, y + 3);
      ctx.bezierCurveTo(x + 8, y - 2, x, y - 2, x, y + 4);
      ctx.fill();
    }
    noGlow();
    ctx.restore();

    if (banner > 0 && state === "play") {
      ctx.save();
      ctx.globalAlpha = clamp(banner, 0, 1);
      ctx.fillStyle = "rgba(4,6,18,.45)";
      ctx.fillRect(0, 280, W, 46);
      ctx.textAlign = "center";
      ctx.fillStyle = C.ice;
      ctx.font = "700 18px ui-sans-serif, system-ui, sans-serif";
      glow(C.ice, 12);
      ctx.fillText(level % 5 === 0 ? "BOSS WAVE" : "WAVE " + level, W / 2, 310);
      noGlow();
      ctx.restore();
    }
  }

  function drawScreens() {
    if (state === "start") {
      ctx.fillStyle = "rgba(4,4,14,.42)";
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";
      ctx.fillStyle = C.ice;
      ctx.font = "700 34px ui-sans-serif, system-ui, sans-serif";
      glow(C.ice, 16);
      ctx.fillText("GALAXY", W / 2, 230);
      ctx.fillStyle = C.hot;
      glow(C.hot, 16);
      ctx.fillText("SHOOTER", W / 2, 272);
      noGlow();
      ctx.fillStyle = C.ui;
      ctx.font = "600 13px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText("Clear the formation. Catch the drops.", W / 2, 318);
      ctx.fillStyle = C.dim;
      ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText("← →  move    space / fire    tap", W / 2, 348);
      if (best) ctx.fillText("BEST  " + best, W / 2, 376);
      const pulse = 0.65 + 0.35 * Math.sin(startT * 3);
      ctx.globalAlpha = pulse;
      ctx.fillStyle = C.ice;
      ctx.font = "700 14px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText("TAP  OR  SPACE  TO  LAUNCH", W / 2, 430);
      ctx.globalAlpha = 1;
    }
    if (state === "over") {
      ctx.fillStyle = "rgba(6,2,10,.55)";
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";
      ctx.fillStyle = C.hot;
      ctx.font = "700 32px ui-sans-serif, system-ui, sans-serif";
      glow(C.hot, 16);
      ctx.fillText("HULL BREACH", W / 2, 250);
      noGlow();
      ctx.fillStyle = C.ui;
      ctx.font = "700 22px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText(String(score), W / 2, 300);
      ctx.fillStyle = C.dim;
      ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText("BEST  " + best + "    WAVE  " + level, W / 2, 328);
      ctx.fillStyle = C.ice;
      ctx.font = "700 14px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText("TAP  TO  REDEPLOY", W / 2, 390);
    }
  }

  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawBg();

    ctx.globalCompositeOperation = "lighter";
    for (const b of bullets) {
      glow(C.ice, 10);
      ctx.fillStyle = "#fff";
      ctx.fillRect(b.x - 1.4, b.y - 8, 2.8, 14);
      ctx.fillStyle = C.ice;
      ctx.fillRect(b.x - 1, b.y - 2, 2, 10);
    }
    for (const b of ebullets) {
      glow(C.rose, 10);
      ctx.fillStyle = C.rose;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.4, 0, TAU); ctx.fill();
    }
    noGlow();
    ctx.globalCompositeOperation = "source-over";

    for (const e of enemies) drawEnemy(e);
    if (state === "play" || state === "over") drawPlayer();

    for (const d of drops) {
      ctx.save();
      ctx.translate(d.x, d.y);
      const col = d.k === "H" ? C.hot : d.k === "S" ? "#5affd0" : d.k === "R" ? C.amber : C.ice;
      glow(col, 12);
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(0, 0, 11, 0, TAU); ctx.fill();
      ctx.fillStyle = "#081018";
      ctx.font = "700 11px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.shadowBlur = 0;
      ctx.fillText(d.k, 0, 1);
      ctx.restore();
    }

    ctx.globalCompositeOperation = "lighter";
    for (const p of parts) {
      const a = clamp(p.life / p.max, 0, 1);
      ctx.globalAlpha = a;
      if (p.t === "ring") {
        ctx.strokeStyle = p.c;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(p.x, p.y, (1 - a) * p.r * 3 + 6, 0, TAU); ctx.stroke();
      } else {
        ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * a, 0, TAU); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";

    for (const q of pops) {
      ctx.globalAlpha = clamp(q.life / q.max, 0, 1);
      ctx.fillStyle = q.c;
      ctx.font = "700 11px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(q.txt, q.x, q.y);
      ctx.globalAlpha = 1;
    }

    if (flash > 0) {
      ctx.fillStyle = `rgba(255,230,255,${flash * 0.45})`;
      ctx.fillRect(0, 0, W, H);
    }
    ctx.restore();
    drawHud();
    drawScreens();
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
