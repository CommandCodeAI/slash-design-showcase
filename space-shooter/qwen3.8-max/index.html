<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#030014">
<title>Galaxy Shooter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #030014 radial-gradient(1100px 750px at 50% 18%, #0b1035 0%, #030014 62%);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    touch-action: none;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    display: block;
    width: min(100vw, calc(100vh * 400 / 700));
    height: min(100vh, calc(100vw * 700 / 400));
    border-radius: 10px;
    box-shadow: 0 0 42px rgba(56,189,248,.22), 0 0 130px rgba(88,28,135,.35);
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="game" width="400" height="700"></canvas>
<script>
'use strict';

const W = 400, H = 700;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const DPR = Math.min(2, window.devicePixelRatio || 1);
canvas.width = W * DPR;
canvas.height = H * DPR;

if (document.fonts) {
  document.fonts.load('900 46px Orbitron');
  document.fonts.load('700 13px Orbitron');
}

const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;

// ---------- state ----------
let state = 'start';      // start | playing | gameover
let paused = false;
let t = 0;
let score = 0;
let best = +(localStorage.getItem('gs-best') || 0);
let newBest = false;
let lives = 3, level = 1, wave = 0;
let goT = 0;
let shake = 0, flash = 0;
let waveDelay = 0.8;
let trailT = 0;
let muted = localStorage.getItem('gs-muted') === '1';

const player = {
  x: W / 2, y: H - 84, r: 13, speed: 330,
  cool: 0, inv: 0, weapon: 0, rapid: 0, shield: 0,
  lean: 0, alive: true
};

let shots = [], eShots = [], foes = [], pows = [];
let parts = [], rings = [], texts = [];

const keys = {};
let touchL = false, touchR = false, touchFire = false, dragX = null;
const ptrs = new Map();

// ---------- starfield & nebulae ----------
const stars = [];
for (let i = 0; i < 110; i++) {
  stars.push({ x: Math.random() * W, y: Math.random() * H, z: Math.random() });
}
const nebulae = [
  { x: 90,  y: 180, r: 175, c: 'rgba(88,28,135,0.30)',  v: 9 },
  { x: 330, y: 430, r: 200, c: 'rgba(14,116,144,0.22)', v: 13 },
  { x: 180, y: 660, r: 150, c: 'rgba(190,24,93,0.15)',  v: 7 }
];

// ---------- audio ----------
let AC = null;
function initAudio() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f0, f1, dur, type, vol) {
  if (!AC || muted) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), AC.currentTime + dur);
  g.gain.setValueAtTime(vol, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
  o.connect(g).connect(AC.destination);
  o.start();
  o.stop(AC.currentTime + dur);
}
const sfx = {
  laser() { tone(880, 240, 0.07, 'square', 0.035); },
  hitf()  { tone(1400, 500, 0.05, 'square', 0.025); },
  boom()  { tone(220, 40, 0.38, 'sawtooth', 0.10); tone(160, 30, 0.5, 'triangle', 0.08); },
  hit()   { tone(140, 45, 0.32, 'sawtooth', 0.14); },
  pow()   { tone(520, 1040, 0.12, 'sine', 0.09); setTimeout(() => tone(780, 1560, 0.14, 'sine', 0.07), 70); },
  ui()    { tone(660, 990, 0.1, 'sine', 0.06); }
};

// ---------- helpers ----------
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function heartPath(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x, y - s * 0.15, x - s * 0.65, y - s * 0.15, x - s * 0.65, y + s * 0.25);
  ctx.bezierCurveTo(x - s * 0.65, y + s * 0.6, x - s * 0.2, y + s * 0.8, x, y + s * 1.05);
  ctx.bezierCurveTo(x + s * 0.2, y + s * 0.8, x + s * 0.65, y + s * 0.6, x + s * 0.65, y + s * 0.25);
  ctx.bezierCurveTo(x + s * 0.65, y - s * 0.15, x, y - s * 0.15, x, y + s * 0.35);
  ctx.closePath();
}
function boom(x, y, color, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = spd * (0.25 + Math.random() * 0.85);
    const life = 0.45 + Math.random() * 0.5;
    parts.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life, max: life, size: 1.5 + Math.random() * 3,
      color: Math.random() < 0.75 ? color : '#f8fafc'
    });
  }
  rings.push({ x, y, r: 6, vr: 300, life: 0.35, color });
}

// ---------- waves & foes ----------
function makeFoe(type, x, y) {
  const L = level;
  const f = { type, x, bx: x, y, t: Math.random() * 6.28, ph: Math.random() * 6.28, hit: 0, fire: 1.2 + Math.random() * 2, dead: false };
  if (type === 'drone') {
    f.hp = 1; f.r = 13; f.score = 50;
    f.vy = 34 + L * 5; f.amp = 34; f.fr = 1.6; f.color = '#e879f9';
  } else if (type === 'striker') {
    f.hp = 2; f.r = 15; f.score = 100;
    f.vy = 46 + L * 6; f.amp = 56; f.fr = 2.2; f.color = '#fb923c';
  } else {
    f.hp = 4 + L; f.r = 20; f.score = 250;
    f.vy = 20 + L * 3; f.amp = 18; f.fr = 0.9; f.color = '#34d399';
  }
  return f;
}

function spawnWave() {
  wave++;
  waveDelay = 1.5;
  const newLevel = Math.floor((wave - 1) / 3) + 1;
  if (newLevel > level) {
    level = newLevel;
    texts.push({ x: W / 2, y: H * 0.34, txt: 'LEVEL UP', c: '#facc15', size: 24, life: 1.6, vy: -14 });
    sfx.pow();
  }
  const kind = (wave - 1) % 3;
  if (kind === 0) {
    // V formation led by a striker
    const n = Math.min(9, 5 + Math.floor(wave / 3));
    for (let i = 0; i < n; i++) {
      const k = Math.ceil(i / 2), side = i % 2 === 0 ? -1 : 1;
      foes.push(makeFoe(i === 0 ? 'striker' : 'drone', W / 2 + side * k * 46, -26 - k * 34));
    }
  } else if (kind === 1) {
    // horizontal line, tank in the middle at higher levels
    const m = Math.min(6, 4 + Math.floor(wave / 4));
    for (let i = 0; i < m; i++) {
      const x = (W / (m + 1)) * (i + 1);
      const type = (level >= 2 && i === Math.floor(m / 2)) ? 'tank' : 'drone';
      foes.push(makeFoe(type, x, -30 - (i % 2) * 38));
    }
  } else {
    // snake column
    const n = Math.min(9, 6 + Math.floor(wave / 3));
    for (let i = 0; i < n; i++) {
      foes.push(makeFoe(i % 4 === 3 ? 'striker' : 'drone', W / 2 + (i % 2 ? 78 : -78), -26 - i * 44));
    }
    if (level >= 3) foes.push(makeFoe('tank', W / 2, -26 - n * 44 - 30));
  }
  texts.push({ x: W / 2, y: H * 0.44, txt: 'WAVE ' + wave, c: '#7dd3fc', size: 22, life: 1.4, vy: -16 });
}

function fireEnemy(f) {
  const sp = 150 + level * 14;
  const mk = (vx, vy, color) => eShots.push({ x: f.x, y: f.y + f.r * 0.6, vx, vy, r: 5, color, dead: false });
  if (f.type === 'tank') {
    for (const a of [-0.35, 0, 0.35]) mk(Math.sin(a) * sp, Math.cos(a) * sp, '#4ade80');
  } else if (f.type === 'striker') {
    const dx = player.x - f.x, dy = player.y - f.y, d = Math.hypot(dx, dy) || 1;
    mk(dx / d * sp * 1.1, dy / d * sp * 1.1, '#fbbf24');
  } else {
    mk(0, sp, '#f0abfc');
  }
}

function updFoe(f, dt, allowFire) {
  f.t += dt;
  if (f.hit > 0) f.hit -= dt;
  f.y += f.vy * dt;
  f.x = f.bx + Math.sin(f.t * f.fr + f.ph) * f.amp;
  if (f.x < f.r) f.x = f.r;
  if (f.x > W - f.r) f.x = W - f.r;
  if (allowFire) {
    f.fire -= dt;
    if (f.fire <= 0 && f.y > 10 && f.y < H - 240 && eShots.length < 46) {
      f.fire = (1.5 + Math.random() * 2.2) * Math.max(0.5, 1.05 - level * 0.05);
      fireEnemy(f);
    }
  }
  if (f.y > H + 70) f.dead = true;
}

function killFoe(f) {
  if (f.dead) return;
  f.dead = true;
  score += f.score;
  boom(f.x, f.y, f.color, f.type === 'tank' ? 36 : 22, f.type === 'tank' ? 330 : 240);
  texts.push({ x: f.x, y: f.y, txt: '+' + f.score, c: f.color, size: f.type === 'tank' ? 16 : 12, life: 0.8, vy: -42 });
  sfx.boom();
  shake = Math.min(11, shake + (f.type === 'tank' ? 7 : 3));
  if (f.type === 'tank') flash = 0.22;
  maybeDrop(f.x, f.y);
}

function maybeDrop(x, y) {
  if (Math.random() > 0.14) return;
  const r = Math.random();
  const kind = r < 0.32 ? 'triple' : r < 0.6 ? 'rapid' : r < 0.85 ? 'shield' : 'life';
  pows.push({ x, y, kind, t: 0, dead: false });
}

// ---------- player ----------
function updPlayer(dt) {
  if (!player.alive) return;
  let dir = 0;
  if (dragX !== null) {
    const d = dragX - player.x;
    player.x += d * Math.min(1, dt * 12);
    dir = Math.max(-1, Math.min(1, d * 0.04));
  } else {
    if (keys.ArrowLeft || keys.a || keys.A || touchL) dir -= 1;
    if (keys.ArrowRight || keys.d || keys.D || touchR) dir += 1;
    player.x += dir * player.speed * dt;
  }
  player.x = Math.max(20, Math.min(W - 20, player.x));
  player.lean += (dir * 0.17 - player.lean) * Math.min(1, dt * 10);
  player.cool -= dt;
  if (player.inv > 0) player.inv -= dt;
  if (player.weapon > 0) player.weapon -= dt;
  if (player.rapid > 0) player.rapid -= dt;
  if (player.cool <= 0) shoot(); // auto-fire; space / FIRE button share the same stream
  trailT -= dt;
  if (trailT <= 0) {
    trailT = 0.03;
    parts.push({
      x: player.x + (Math.random() * 8 - 4), y: player.y + 15,
      vx: (Math.random() - 0.5) * 26, vy: 110 + Math.random() * 70,
      life: 0.32, max: 0.32, size: 2.3,
      color: Math.random() < 0.5 ? '#22d3ee' : '#818cf8'
    });
  }
}

function shoot() {
  player.cool = player.rapid > 0 ? 0.12 : 0.26;
  const mk = (ang, ox) => shots.push({
    x: player.x + ox, y: player.y - 20,
    vx: Math.sin(ang) * 540, vy: -Math.cos(ang) * 540,
    r: 4, dead: false
  });
  if (player.weapon > 0) { mk(-0.16, -7); mk(0, 0); mk(0.16, 7); }
  else mk(0, 0);
  sfx.laser();
}

function playerHit() {
  if (!player.alive || player.inv > 0) return;
  if (player.shield > 0) {
    player.shield = 0;
    player.inv = 1;
    boom(player.x, player.y, '#a78bfa', 14, 200);
    sfx.hit();
    shake = 6;
    return;
  }
  lives--;
  sfx.hit();
  shake = 13; flash = 0.4;
  boom(player.x, player.y, '#7dd3fc', 26, 300);
  player.inv = 2.4;
  player.weapon = 0; player.rapid = 0;
  if (lives <= 0) gameOver();
}

function collect(p) {
  sfx.pow();
  const pop = (txt, c) => texts.push({ x: player.x, y: player.y - 36, txt, c, size: 13, life: 0.9, vy: -40 });
  if (p.kind === 'triple') { player.weapon = 9; pop('TRIPLE SHOT', '#22d3ee'); }
  else if (p.kind === 'rapid') { player.rapid = 9; pop('RAPID FIRE', '#facc15'); }
  else if (p.kind === 'shield') { player.shield = 1; pop('SHIELD', '#a78bfa'); }
  else { lives = Math.min(5, lives + 1); pop('+1 LIFE', '#fb7185'); }
}

function updPow(p, dt) {
  p.t += dt;
  if (state === 'playing' && player.alive) {
    const dx = player.x - p.x, dy = player.y - p.y, d = Math.hypot(dx, dy);
    if (d < 90 && d > 1) {
      p.x += dx / d * 170 * dt;
      p.y += dy / d * 170 * dt;
      return;
    }
  }
  p.y += 64 * dt;
}

// ---------- collisions ----------
function collide() {
  for (const s of shots) {
    if (s.dead) continue;
    for (const f of foes) {
      if (f.dead) continue;
      const dx = s.x - f.x, dy = s.y - f.y;
      if (dx * dx + dy * dy < (f.r + 5) * (f.r + 5)) {
        s.dead = true;
        f.hp--; f.hit = 0.12;
        parts.push({ x: s.x, y: s.y, vx: (Math.random() - 0.5) * 80, vy: -60 - Math.random() * 60, life: 0.2, max: 0.2, size: 2, color: '#e0f2fe' });
        if (f.hp <= 0) killFoe(f);
        else sfx.hitf();
        break;
      }
    }
  }
  if (!player.alive) return;
  for (const b of eShots) {
    if (b.dead) continue;
    const dx = b.x - player.x, dy = b.y - player.y;
    if (dx * dx + dy * dy < (b.r + player.r - 3) * (b.r + player.r - 3)) {
      b.dead = true;
      playerHit();
    }
  }
  for (const f of foes) {
    if (f.dead) continue;
    const dx = f.x - player.x, dy = f.y - player.y;
    if (dx * dx + dy * dy < (f.r + player.r - 2) * (f.r + player.r - 2)) {
      killFoe(f);
      playerHit();
    }
  }
  for (const p of pows) {
    if (p.dead) continue;
    const dx = p.x - player.x, dy = p.y - player.y;
    if (dx * dx + dy * dy < 28 * 28) {
      p.dead = true;
      collect(p);
    }
  }
}

// ---------- flow ----------
function startGame() {
  score = 0; lives = 3; level = 1; wave = 0;
  shots = []; eShots = []; foes = []; pows = [];
  parts = []; rings = []; texts = [];
  player.x = W / 2; player.alive = true; player.inv = 1.2;
  player.cool = 0; player.weapon = 0; player.rapid = 0;
  player.shield = 0; player.lean = 0;
  waveDelay = 0.8; paused = false; newBest = false;
  state = 'playing';
  sfx.ui();
}

function gameOver() {
  state = 'gameover';
  goT = 0;
  player.alive = false;
  boom(player.x, player.y, '#38bdf8', 50, 380);
  boom(player.x, player.y, '#f0abfc', 30, 260);
  shake = 18; flash = 0.7;
  newBest = score > best;
  if (newBest) {
    best = score;
    localStorage.setItem('gs-best', String(best));
  }
  sfx.boom();
}

// ---------- update ----------
function updParticles(dt) {
  for (const p of parts) {
    p.life -= dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    const d = Math.max(0, 1 - 2.6 * dt);
    p.vx *= d; p.vy *= d;
  }
  parts = parts.filter(p => p.life > 0);
  for (const r of rings) { r.life -= dt; r.r += r.vr * dt; }
  rings = rings.filter(r => r.life > 0);
  for (const x of texts) { x.life -= dt; x.y += x.vy * dt; }
  texts = texts.filter(x => x.life > 0);
}

function update(dt) {
  if (shake > 0) shake = Math.max(0, shake - 44 * dt);
  if (flash > 0) flash = Math.max(0, flash - 2.4 * dt);

  const boost = state === 'playing' ? 1 + (level - 1) * 0.07 : 0.5;
  for (const s of stars) {
    s.y += (18 + s.z * 130) * boost * dt;
    if (s.y > H + 2) { s.y = -2; s.x = Math.random() * W; }
  }
  for (const n of nebulae) {
    n.y += n.v * dt;
    if (n.y - n.r > H) { n.y = -n.r - 20; n.x = 60 + Math.random() * (W - 120); }
  }
  updParticles(dt);
  if (state === 'gameover') goT += dt;
  if (state === 'start') return;

  for (const s of shots) {
    s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.y < -24 || s.x < -24 || s.x > W + 24) s.dead = true;
  }
  for (const b of eShots) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y > H + 24 || b.x < -24 || b.x > W + 24) b.dead = true;
  }
  for (const f of foes) updFoe(f, dt, state === 'playing');
  for (const p of pows) updPow(p, dt);

  if (state === 'playing') {
    if (foes.every(f => f.dead)) {
      waveDelay -= dt;
      if (waveDelay <= 0) spawnWave();
    }
    updPlayer(dt);
    collide();
  }

  shots = shots.filter(s => !s.dead);
  eShots = eShots.filter(b => !b.dead);
  foes = foes.filter(f => !f.dead);
  pows = pows.filter(p => !p.dead && p.y < H + 40);
}

// ---------- drawing ----------
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#050014');
  g.addColorStop(0.55, '#0a0630');
  g.addColorStop(1, '#02000d');
  ctx.fillStyle = g;
  ctx.fillRect(-20, -20, W + 40, H + 40);

  for (const n of nebulae) {
    const rg = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
    rg.addColorStop(0, n.c);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(n.x - n.r, n.y - n.r, n.r * 2, n.r * 2);
  }

  for (const s of stars) {
    const a = 0.35 + 0.65 * Math.abs(Math.sin(s.x * 3.1 + t * 2));
    ctx.globalAlpha = a * (0.4 + s.z * 0.6);
    ctx.fillStyle = s.z > 0.75 ? '#bae6fd' : '#e2e8f0';
    const sz = s.z > 0.75 ? 2.2 : 1.4;
    ctx.fillRect(s.x, s.y, sz, sz);
  }
  ctx.globalAlpha = 1;
}

function drawDrone(f) {
  ctx.shadowColor = '#e879f9';
  ctx.shadowBlur = 14;
  const g = ctx.createLinearGradient(0, -10, 0, 10);
  g.addColorStop(0, '#f0abfc');
  g.addColorStop(0.5, '#a21caf');
  g.addColorStop(1, '#4a044e');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(0, 2, 14, 8, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(240,171,252,0.9)';
  ctx.beginPath();
  ctx.arc(0, -2, 6, Math.PI, 0);
  ctx.fill();
  ctx.shadowBlur = 0;
  for (let i = -1; i <= 1; i++) {
    const on = Math.sin(f.t * 8 + i) > 0;
    ctx.fillStyle = on ? '#fdf4ff' : '#86198f';
    ctx.beginPath();
    ctx.arc(i * 7, 4, 1.8, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawStriker(f) {
  ctx.shadowColor = '#fb923c';
  ctx.shadowBlur = 14;
  const g = ctx.createLinearGradient(0, -14, 0, 14);
  g.addColorStop(0, '#7c2d12');
  g.addColorStop(0.5, '#ea580c');
  g.addColorStop(1, '#fde68a');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0, 16);
  ctx.lineTo(13, -4);
  ctx.lineTo(7, -12);
  ctx.lineTo(-7, -12);
  ctx.lineTo(-13, -4);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fef3c7';
  ctx.beginPath();
  ctx.arc(0, 2, 3.5, 0, Math.PI * 2);
  ctx.fill();
}

function drawTank(f) {
  ctx.shadowColor = '#34d399';
  ctx.shadowBlur = 16;
  const g = ctx.createLinearGradient(0, -18, 0, 18);
  g.addColorStop(0, '#a7f3d0');
  g.addColorStop(0.4, '#059669');
  g.addColorStop(1, '#064e3b');
  ctx.fillStyle = g;
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 6 + i * Math.PI / 3;
    ctx.lineTo(Math.cos(a) * 18, Math.sin(a) * 16);
  }
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#022c22';
  ctx.fillRect(-10, 10, 5, 10);
  ctx.fillRect(5, 10, 5, 10);
  const p = 0.6 + 0.4 * Math.sin(f.t * 5);
  ctx.fillStyle = 'rgba(167,243,208,' + p + ')';
  ctx.beginPath();
  ctx.arc(0, 0, 6, 0, Math.PI * 2);
  ctx.fill();
}

function drawFoe(f) {
  ctx.save();
  ctx.translate(f.x, f.y);
  if (f.type === 'drone') drawDrone(f);
  else if (f.type === 'striker') drawStriker(f);
  else drawTank(f);
  if (f.hit > 0) {
    ctx.globalAlpha = Math.min(1, f.hit * 8);
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, 0, f.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawShip(x, y, lean) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(lean);
  const fl = 10 + Math.sin(t * 42) * 3 + Math.random() * 3;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const fg = ctx.createLinearGradient(0, 12, 0, 20 + fl);
  fg.addColorStop(0, 'rgba(224,242,254,0.95)');
  fg.addColorStop(0.4, 'rgba(56,189,248,0.7)');
  fg.addColorStop(1, 'rgba(56,189,248,0)');
  ctx.fillStyle = fg;
  ctx.beginPath();
  ctx.moveTo(-4, 12);
  ctx.lineTo(4, 12);
  ctx.lineTo(0, 18 + fl);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  ctx.shadowColor = '#38bdf8';
  ctx.shadowBlur = 18;
  const g = ctx.createLinearGradient(0, -22, 0, 14);
  g.addColorStop(0, '#f0f9ff');
  g.addColorStop(0.35, '#7dd3fc');
  g.addColorStop(0.75, '#2563eb');
  g.addColorStop(1, '#1e3a8a');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0, -22);
  ctx.lineTo(5, -10); ctx.lineTo(7, -2); ctx.lineTo(17, 8); ctx.lineTo(13, 12); ctx.lineTo(6, 8);
  ctx.lineTo(4, 12); ctx.lineTo(-4, 12); ctx.lineTo(-6, 8); ctx.lineTo(-13, 12); ctx.lineTo(-17, 8);
  ctx.lineTo(-7, -2); ctx.lineTo(-5, -10);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(224,242,254,0.85)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-17, 8); ctx.lineTo(-7, -2);
  ctx.moveTo(17, 8); ctx.lineTo(7, -2);
  ctx.stroke();
  const cg = ctx.createLinearGradient(0, -12, 0, 2);
  cg.addColorStop(0, '#e0f2fe');
  cg.addColorStop(1, '#0284c7');
  ctx.fillStyle = cg;
  ctx.shadowColor = '#bae6fd';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.ellipse(0, -6, 3.2, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawPlayerShip() {
  if (!player.alive) return;
  if (player.inv > 0 && Math.sin(t * 28) > 0.2) ctx.globalAlpha = 0.35;
  drawShip(player.x, player.y, player.lean);
  ctx.globalAlpha = 1;
  if (player.shield > 0) {
    const a = 0.5 + 0.3 * Math.sin(t * 6);
    ctx.strokeStyle = 'rgba(167,139,250,' + a + ')';
    ctx.lineWidth = 2.5;
    ctx.shadowColor = '#a78bfa';
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.arc(player.x, player.y - 4, 26, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(167,139,250,0.08)';
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function drawShots() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.shadowColor = '#22d3ee';
  ctx.shadowBlur = 10;
  for (const s of shots) {
    ctx.fillStyle = '#a5f3fc';
    ctx.fillRect(s.x - 2, s.y - 9, 4, 16);
    ctx.fillStyle = '#f0fdff';
    ctx.fillRect(s.x - 1, s.y - 7, 2, 10);
  }
  ctx.restore();
}

function drawEShots() {
  for (const b of eShots) {
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 12;
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r * 0.45, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawPow(p) {
  const cols = { triple: '#22d3ee', rapid: '#facc15', shield: '#a78bfa', life: '#fb7185' };
  const c = cols[p.kind];
  ctx.save();
  ctx.translate(p.x, p.y + Math.sin(p.t * 4) * 3);
  const pulse = 0.75 + 0.25 * Math.sin(p.t * 6);
  ctx.shadowColor = c;
  ctx.shadowBlur = 16 * pulse;
  ctx.save();
  ctx.rotate(Math.PI / 4);
  rr(-10, -10, 20, 20, 5);
  ctx.fillStyle = 'rgba(2,6,23,0.9)';
  ctx.fill();
  ctx.strokeStyle = c;
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();
  ctx.shadowBlur = 6;
  if (p.kind === 'life') {
    ctx.fillStyle = c;
    heartPath(0, -6, 9);
    ctx.fill();
  } else {
    ctx.fillStyle = c;
    ctx.font = '900 12px Orbitron, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText({ triple: 'T', rapid: 'R', shield: 'S' }[p.kind], 0, 1);
  }
  ctx.restore();
}

function drawParticles() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(0.4, p.size * (p.life / p.max)), 0, Math.PI * 2);
    ctx.fill();
  }
  for (const r of rings) {
    ctx.globalAlpha = Math.max(0, r.life * 2.2);
    ctx.strokeStyle = r.color;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawTexts() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const x of texts) {
    ctx.globalAlpha = Math.max(0, Math.min(1, x.life * 1.6));
    ctx.font = '900 ' + x.size + 'px Orbitron, monospace';
    ctx.fillStyle = x.c;
    ctx.shadowColor = x.c;
    ctx.shadowBlur = 10;
    ctx.fillText(x.txt, x.x, x.y);
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

function drawHeartIcon(x, y, on) {
  heartPath(x, y, 10);
  if (on) {
    ctx.fillStyle = '#fb7185';
    ctx.shadowColor = '#f43f5e';
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;
  } else {
    ctx.strokeStyle = 'rgba(251,113,133,0.28)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
}

function drawTimer(x, y, frac, color) {
  ctx.fillStyle = 'rgba(148,163,184,0.2)';
  ctx.fillRect(x, y, 70, 4);
  ctx.fillStyle = color;
  ctx.fillRect(x, y, 70 * Math.max(0, Math.min(1, frac)), 4);
}

function drawHUD() {
  const g = ctx.createLinearGradient(0, 0, 0, 54);
  g.addColorStop(0, 'rgba(2,2,20,0.75)');
  g.addColorStop(1, 'rgba(2,2,20,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, 54);

  ctx.textBaseline = 'top';
  ctx.textAlign = 'left';
  ctx.font = '700 11px Orbitron, monospace';
  ctx.fillStyle = '#7dd3fc';
  ctx.shadowColor = '#0ea5e9';
  ctx.shadowBlur = 8;
  ctx.fillText('SCORE', 12, 10);
  ctx.font = '900 17px Orbitron, monospace';
  ctx.fillStyle = '#e0f2fe';
  ctx.fillText(String(score).padStart(6, '0'), 12, 25);
  ctx.shadowBlur = 0;

  ctx.textAlign = 'center';
  ctx.font = '700 13px Orbitron, monospace';
  ctx.fillStyle = '#c084fc';
  ctx.shadowColor = '#a855f7';
  ctx.shadowBlur = 6;
  ctx.fillText('LEVEL ' + level, W / 2, 10);
  ctx.shadowBlur = 0;
  ctx.font = '700 10px Orbitron, monospace';
  ctx.fillStyle = '#94a3b8';
  ctx.fillText('WAVE ' + wave, W / 2, 28);

  for (let i = 0; i < 5; i++) drawHeartIcon(W - 20 - i * 22, 13, i < lives);

  let py = 52;
  if (player.weapon > 0) { drawTimer(12, py, player.weapon / 9, '#22d3ee'); py += 9; }
  if (player.rapid > 0) { drawTimer(12, py, player.rapid / 9, '#facc15'); }
}

const btnL = { x: 58, y: H - 56, r: 30 };
const btnR = { x: 136, y: H - 56, r: 30 };
const btnF = { x: W - 62, y: H - 56, r: 36 };

function drawBtn(b, on, glyph) {
  ctx.globalAlpha = on ? 0.95 : 0.5;
  ctx.fillStyle = 'rgba(10,15,40,0.6)';
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = on ? '#7dd3fc' : 'rgba(125,211,252,0.6)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#bae6fd';
  glyph();
  ctx.globalAlpha = 1;
}

function drawButtons() {
  if (!isTouch || state !== 'playing' || paused) return;
  drawBtn(btnL, touchL, () => {
    ctx.beginPath();
    ctx.moveTo(btnL.x + 7, btnL.y - 10);
    ctx.lineTo(btnL.x - 8, btnL.y);
    ctx.lineTo(btnL.x + 7, btnL.y + 10);
    ctx.closePath();
    ctx.fill();
  });
  drawBtn(btnR, touchR, () => {
    ctx.beginPath();
    ctx.moveTo(btnR.x - 7, btnR.y - 10);
    ctx.lineTo(btnR.x + 8, btnR.y);
    ctx.lineTo(btnR.x - 7, btnR.y + 10);
    ctx.closePath();
    ctx.fill();
  });
  drawBtn(btnF, touchFire, () => {
    ctx.font = '900 12px Orbitron, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('FIRE', btnF.x, btnF.y + 1);
  });
}

function drawStart() {
  for (let i = 0; i < 3; i++) {
    const fx = ((t * (26 + i * 12)) + i * 160) % (W + 140) - 70;
    const fy = 118 + i * 52 + Math.sin(t * 1.5 + i) * 10;
    drawFoe({ type: ['drone', 'striker', 'drone'][i], x: fx, y: fy, t: t + i * 2, hit: 0 });
  }

  drawShip(W / 2, 478 + Math.sin(t * 2) * 6, Math.sin(t * 1.3) * 0.08);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.font = '900 46px Orbitron, sans-serif';
  const tg = ctx.createLinearGradient(0, 205, 0, 305);
  tg.addColorStop(0, '#bae6fd');
  tg.addColorStop(0.45, '#38bdf8');
  tg.addColorStop(1, '#c026d3');
  ctx.fillStyle = tg;
  ctx.shadowColor = '#38bdf8';
  ctx.shadowBlur = 24;
  ctx.fillText('GALAXY', W / 2, 250);
  ctx.fillText('SHOOTER', W / 2, 302);
  ctx.shadowBlur = 0;

  ctx.font = '700 11px Orbitron, monospace';
  ctx.fillStyle = '#94a3b8';
  ctx.fillText('R E T R O   S P A C E   B L A S T E R', W / 2, 330);

  if (best > 0) {
    ctx.font = '700 12px Orbitron, monospace';
    ctx.fillStyle = '#fbbf24';
    ctx.shadowColor = '#f59e0b';
    ctx.shadowBlur = 8;
    ctx.fillText('BEST ' + String(best).padStart(6, '0'), W / 2, 358);
    ctx.shadowBlur = 0;
  }

  ctx.globalAlpha = 0.55 + 0.45 * Math.sin(t * 3.5);
  ctx.font = '700 16px Orbitron, monospace';
  ctx.fillStyle = '#e0f2fe';
  ctx.shadowColor = '#38bdf8';
  ctx.shadowBlur = 10;
  ctx.fillText(isTouch ? 'TAP TO LAUNCH' : 'PRESS SPACE TO LAUNCH', W / 2, 566);
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  ctx.font = '600 10px Orbitron, monospace';
  ctx.fillStyle = '#64748b';
  ctx.fillText(isTouch ? 'DRAG TO MOVE · AUTO-FIRE ENGAGED' : 'ARROWS MOVE · SPACE FIRE · P PAUSE', W / 2, 600);
  ctx.fillText('M SOUND ' + (muted ? 'OFF' : 'ON'), W / 2, 618);
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(3,0,20,0.78)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.font = '900 42px Orbitron, sans-serif';
  ctx.fillStyle = '#fb7185';
  ctx.shadowColor = '#e11d48';
  ctx.shadowBlur = 22;
  ctx.fillText('GAME OVER', W / 2, 252);
  ctx.shadowBlur = 0;

  ctx.font = '700 12px Orbitron, monospace';
  ctx.fillStyle = '#94a3b8';
  ctx.fillText('FINAL SCORE', W / 2, 306);
  ctx.font = '900 30px Orbitron, monospace';
  ctx.fillStyle = '#e0f2fe';
  ctx.fillText(String(score).padStart(6, '0'), W / 2, 342);

  if (newBest) {
    ctx.fillStyle = '#facc15';
    ctx.font = '700 13px Orbitron, monospace';
    ctx.shadowColor = '#f59e0b';
    ctx.shadowBlur = 10;
    ctx.fillText('NEW BEST', W / 2, 370);
    ctx.shadowBlur = 0;
  } else {
    ctx.fillStyle = '#64748b';
    ctx.font = '600 12px Orbitron, monospace';
    ctx.fillText('BEST ' + String(best).padStart(6, '0'), W / 2, 370);
  }

  ctx.fillStyle = '#7dd3fc';
  ctx.font = '600 11px Orbitron, monospace';
  ctx.fillText('REACHED WAVE ' + wave + ' · LEVEL ' + level, W / 2, 398);

  if (goT > 0.6) {
    ctx.globalAlpha = 0.55 + 0.45 * Math.sin(t * 3.5);
    ctx.fillStyle = '#e0f2fe';
    ctx.font = '700 15px Orbitron, monospace';
    ctx.fillText(isTouch ? 'TAP TO RESTART' : 'PRESS SPACE TO RESTART', W / 2, 470);
    ctx.globalAlpha = 1;
  }
}

function drawPaused() {
  ctx.fillStyle = 'rgba(3,0,20,0.6)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.font = '900 30px Orbitron, sans-serif';
  ctx.fillStyle = '#e0f2fe';
  ctx.shadowColor = '#38bdf8';
  ctx.shadowBlur = 16;
  ctx.fillText('PAUSED', W / 2, 322);
  ctx.shadowBlur = 0;
  ctx.font = '600 11px Orbitron, monospace';
  ctx.fillStyle = '#94a3b8';
  ctx.fillText(isTouch ? 'TAP TO RESUME' : 'PRESS P TO RESUME', W / 2, 354);
}

const vin = ctx.createRadialGradient(W / 2, H / 2, H * 0.34, W / 2, H / 2, H * 0.74);
vin.addColorStop(0, 'rgba(0,0,0,0)');
vin.addColorStop(1, 'rgba(2,0,16,0.55)');

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (shake > 0.2) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  drawBackground();

  if (state === 'start') {
    drawStart();
    ctx.fillStyle = vin;
    ctx.fillRect(-20, -20, W + 40, H + 40);
    return;
  }

  pows.forEach(drawPow);
  foes.forEach(drawFoe);
  drawShots();
  drawEShots();
  drawPlayerShip();
  drawParticles();
  drawTexts();
  drawHUD();
  drawButtons();

  if (state === 'gameover') drawGameOver();
  if (paused) drawPaused();

  if (flash > 0) {
    ctx.fillStyle = 'rgba(240,249,255,' + Math.min(0.7, flash) + ')';
    ctx.fillRect(-20, -20, W + 40, H + 40);
  }
  ctx.fillStyle = vin;
  ctx.fillRect(-20, -20, W + 40, H + 40);
}

// ---------- input ----------
function pos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
function near(p, b) {
  return Math.hypot(p.x - b.x, p.y - b.y) < b.r + 12;
}

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  initAudio();
  const p = pos(e);
  if (state === 'start') { startGame(); return; }
  if (state === 'gameover') { if (goT > 0.6) startGame(); return; }
  if (paused) { paused = false; return; }
  let role = 'drag';
  if (isTouch) {
    if (near(p, btnL)) role = 'L';
    else if (near(p, btnR)) role = 'R';
    else if (near(p, btnF)) role = 'F';
  }
  if (role === 'L') touchL = true;
  else if (role === 'R') touchR = true;
  else if (role === 'F') touchFire = true;
  else dragX = p.x;
  ptrs.set(e.pointerId, role);
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
});

canvas.addEventListener('pointermove', e => {
  if (ptrs.get(e.pointerId) === 'drag') dragX = pos(e).x;
});

function endPtr(e) {
  const role = ptrs.get(e.pointerId);
  if (role === 'L') touchL = false;
  if (role === 'R') touchR = false;
  if (role === 'F') touchFire = false;
  if (role === 'drag') dragX = null;
  ptrs.delete(e.pointerId);
}
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  if ([' ', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) e.preventDefault();
  keys[e.key] = true;
  initAudio();
  if (e.key === 'm' || e.key === 'M') {
    muted = !muted;
    localStorage.setItem('gs-muted', muted ? '1' : '0');
  }
  if (state === 'start' && (e.key === ' ' || e.key === 'Enter')) startGame();
  else if (state === 'gameover' && (e.key === ' ' || e.key === 'Enter') && goT > 0.6) startGame();
  else if (state === 'playing' && (e.key === 'p' || e.key === 'P')) paused = !paused;
});
window.addEventListener('keyup', e => { keys[e.key] = false; });
window.addEventListener('blur', () => { if (state === 'playing') paused = true; });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'playing') paused = true; });

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  if (!paused) {
    t += dt;
    update(dt);
  }
  render();
}
requestAnimationFrame(frame);
</script>
</body>
</html>
