<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf4e3">
<title>Flappy Mochi — a tiny, very round adventure</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐤</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#5a4632;
    --ink-soft:#8a7560;
    --cream:#fff6ea;
    --paper:#fdf4e3;
    --coral:#ff8e78;
    --coral-deep:#e26d5a;
    --butter:#ffd75e;
    --mint:#7cc796;
    --shadow:0 2px 4px rgba(90,70,50,.08), 0 14px 34px rgba(90,70,50,.18);
    --font:'Baloo 2', ui-rounded, 'Segoe UI', system-ui, sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:var(--font);
    color:var(--ink);
    background:
      radial-gradient(1100px 500px at 15% -10%, #ffe9cf 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 110%, #d9eef7 0%, transparent 55%),
      var(--paper);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:18px 12px calc(18px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color:transparent;
  }
  .shell{
    position:relative;
    width:min(440px, 100%, calc((100svh - 120px) * 0.625));
    aspect-ratio:5/8;
    border-radius:26px;
    overflow:hidden;
    box-shadow:var(--shadow), 0 0 0 6px #fffdf8, 0 0 0 7px rgba(90,70,50,.12);
    container-type:size;
    touch-action:manipulation;
    user-select:none;
  }
  canvas{display:block;width:100%;height:100%}
  #shell{
    width: 450px !important;
    height: 700px !important;
    aspect-ratio: auto !important;
  }

  .icon-btn{
    position:absolute;top:3cqw;right:3cqw;z-index:6;
    width:11cqw;height:11cqw;min-width:44px;min-height:44px;
    border-radius:50%;
    border:2px solid rgba(90,70,50,.18);
    background:rgba(255,250,240,.9);
    color:var(--ink);
    font-size:max(5cqw,20px);
    display:grid;place-items:center;
    cursor:pointer;
    box-shadow:0 2px 8px rgba(90,70,50,.15);
    transition:transform .18s cubic-bezier(.2,.9,.3,1.2), background .18s;
  }
  .icon-btn:hover{transform:scale(1.08);background:#fff}
  .icon-btn:active{transform:scale(.94)}
  .icon-btn:focus-visible{outline:3px dashed var(--coral-deep);outline-offset:3px}
  .icon-btn[aria-pressed="true"]{background:#f3e3d3;color:var(--ink-soft)}

  .overlay{
    position:absolute;inset:0;z-index:5;
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;
  }
  .overlay.hidden{display:none}

  /* start card */
  #startScreen .card{
    text-align:center;
    padding:7cqw 8cqw;
    animation:floatIn .55s cubic-bezier(.16,1,.3,1) both;
  }
  .chip{
    display:inline-block;
    font-weight:700;font-size:max(2.9cqw,11px);
    letter-spacing:.14em;text-transform:uppercase;
    color:var(--coral-deep);
    background:rgba(255,255,255,.75);
    border:1.5px solid rgba(226,109,90,.35);
    padding:.55em 1.1em;border-radius:999px;
    backdrop-filter:blur(4px);
  }
  .title{
    margin-top:3.2cqw;
    font-size:max(11.5cqw,34px);
    font-weight:800;line-height:1.02;
    color:#fffaf0;
    text-shadow:0 3px 0 var(--coral-deep), 0 5px 14px rgba(90,70,50,.35);
  }
  .title .flap{color:var(--butter)}
  .subtitle{
    margin-top:2.4cqw;
    font-size:max(3.9cqw,14px);
    font-weight:600;
    color:var(--ink);
    background:rgba(255,250,240,.72);
    backdrop-filter:blur(4px);
    border-radius:4cqw;padding:2cqw 4cqw;
    max-width:64cqw;margin-inline:auto;
    line-height:1.45;
  }
  .hint{
    margin-top:4cqw;
    display:flex;gap:2cqw;justify-content:center;align-items:center;flex-wrap:wrap;
    animation:pulse 1.6s ease-in-out infinite;
  }
  .kbd{
    font-family:var(--font);font-weight:700;
    font-size:max(3.2cqw,12px);
    background:#fffdf8;color:var(--ink);
    border:2px solid rgba(90,70,50,.25);
    border-bottom-width:4px;
    border-radius:2.2cqw;
    padding:.5em .9em;
  }
  .hint span{font-size:max(3.2cqw,12px);font-weight:600;color:var(--ink-soft)}

  /* game over */
  #overScreen{background:rgba(74,52,34,.32);backdrop-filter:blur(3px);pointer-events:auto}
  #overScreen .panel{
    width:78cqw;max-width:340px;
    background:var(--cream);
    border-radius:6cqw;
    border:2px solid rgba(90,70,50,.14);
    box-shadow:0 18px 44px rgba(50,30,15,.35);
    padding:6cqw 6cqw 5.5cqw;
    text-align:center;
    animation:popIn .42s cubic-bezier(.34,1.4,.44,1) both;
  }
  .over-title{font-size:max(7.5cqw,24px);font-weight:800;color:var(--ink);line-height:1.1}
  .over-sub{margin-top:1cqw;font-size:max(3.6cqw,13px);font-weight:600;color:var(--ink-soft)}
  .scores{
    margin-top:4.5cqw;
    display:grid;grid-template-columns:1fr 1fr;gap:3cqw;
  }
  .score-box{
    background:#fff;
    border:2px solid rgba(90,70,50,.12);
    border-radius:4cqw;
    padding:2.6cqw 2cqw 2.2cqw;
  }
  .score-box .label{
    font-size:max(2.9cqw,10.5px);font-weight:700;
    letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);
  }
  .score-box .value{font-size:max(9cqw,28px);font-weight:800;line-height:1.15;color:var(--ink)}
  .score-box.best .value{color:var(--coral-deep)}
  .medal-row{margin-top:3.4cqw;display:flex;justify-content:center;gap:2cqw;flex-wrap:wrap}
  .medal{
    display:inline-flex;align-items:center;gap:.55em;
    font-size:max(3.3cqw,12px);font-weight:700;color:var(--ink);
    background:#fff;border:2px solid rgba(90,70,50,.14);
    border-radius:999px;padding:.5em 1.1em;
  }
  .medal .dot{width:3.6cqw;height:3.6cqw;min-width:14px;min-height:14px;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
  .newbest{
    background:var(--butter);border-color:rgba(90,70,50,.25);
    animation:wobble 1.1s ease-in-out infinite;
  }
  #btnAgain{
    margin-top:5cqw;width:100%;
    font-family:var(--font);
    font-size:max(4.6cqw,16px);font-weight:800;
    color:#fff8ec;background:var(--coral);
    border:none;border-radius:999px;
    padding:.85em 1em;
    cursor:pointer;
    box-shadow:0 4px 0 var(--coral-deep);
    transition:transform .15s cubic-bezier(.2,.9,.3,1.3), box-shadow .15s, background .15s;
  }
  #btnAgain:hover{background:#ff9d89;transform:translateY(-2px);box-shadow:0 6px 0 var(--coral-deep)}
  #btnAgain:active{transform:translateY(2px);box-shadow:0 1px 0 var(--coral-deep)}
  #btnAgain:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
  .over-hint{margin-top:2.6cqw;font-size:max(3.1cqw,11.5px);font-weight:600;color:var(--ink-soft)}

  #pauseChip{
    position:absolute;top:4cqw;left:50%;transform:translateX(-50%);z-index:7;
    background:rgba(255,250,240,.92);color:var(--ink);
    font-weight:800;font-size:max(3.6cqw,13px);
    padding:.6em 1.4em;border-radius:999px;
    border:2px solid rgba(90,70,50,.2);
    box-shadow:0 4px 14px rgba(90,70,50,.2);
  }
  #pauseChip.hidden{display:none}

  .legend{
    display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;
    font-size:13px;font-weight:600;color:var(--ink-soft);
  }
  .legend kbd{
    font-family:var(--font);font-weight:700;font-size:12px;color:var(--ink);
    background:#fffdf8;border:1.5px solid rgba(90,70,50,.25);border-bottom-width:3px;
    border-radius:7px;padding:.25em .6em;margin-right:4px;
  }
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @keyframes floatIn{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
  @keyframes popIn{0%{opacity:0;transform:scale(.9)}60%{opacity:1;transform:scale(1.03)}100%{transform:scale(1)}}
  @keyframes pulse{0%,100%{opacity:1;transform:translateY(0)}50%{opacity:.72;transform:translateY(3px)}}
  @keyframes wobble{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
  @media (prefers-reduced-motion: reduce){
    .hint,.newbest{animation:none}
    #startScreen .card,#overScreen .panel{animation-duration:.01s}
    *{transition-duration:.08s !important}
  }
</style>
</head>
<body>

<div class="shell" id="shell">
  <canvas id="game" width="400" height="640" aria-label="Flappy Mochi game canvas" role="img"></canvas>

  <button class="icon-btn" id="btnMute" type="button" aria-pressed="false" aria-label="Mute sound effects" title="Mute (M)">🔊</button>

  <div class="overlay" id="startScreen">
    <div class="card">
      <span class="chip">Canvas arcade</span>
      <h1 class="title">Flappy<br><span class="flap">Mochi</span></h1>
      <p class="subtitle">A tiny, very round bird. A corridor of coral pipes. One tap between the two.</p>
      <div class="hint">
        <span class="kbd">Space</span><span class="kbd">↑</span><span class="kbd">Tap</span>
        <span>to flap</span>
      </div>
    </div>
  </div>

  <div class="overlay hidden" id="overScreen" role="dialog" aria-modal="true" aria-labelledby="overTitle">
    <div class="panel" id="overPanel">
      <h2 class="over-title" id="overTitle">Mochi needs a nap</h2>
      <p class="over-sub" id="overSub">Ruffled feathers, but no regrets.</p>
      <div class="medal-row" id="medalRow"></div>
      <div class="scores">
        <div class="score-box">
          <div class="label">Score</div>
          <div class="value" id="finalScore">0</div>
        </div>
        <div class="score-box best">
          <div class="label">Best</div>
          <div class="value" id="bestScore">0</div>
        </div>
      </div>
      <button id="btnAgain" type="button">Play again</button>
      <p class="over-hint">or press space</p>
    </div>
  </div>

  <div id="pauseChip" class="hidden">Paused — press P or tap</div>
</div>

<div class="legend">
  <span><kbd>Space</kbd>flap</span>
  <span><kbd>P</kbd>pause</span>
  <span><kbd>M</kbd>mute</span>
</div>
<p class="sr-only" id="live" aria-live="polite"></p>

<script>
(() => {
"use strict";

const W = 400, H = 640, GROUND_Y = 560, STEP = 1000 / 60;
const PIPE_W = 62, PIPE_SPACING = 215;
const GRAV = 0.42, FLAP_V = -6.9, MAX_FALL = 9.4;
const BIRD_X = 108, BIRD_R = 15;

const cvs = document.getElementById("game");
const ctx = cvs.getContext("2d");
const shell = document.getElementById("shell");
const startScreen = document.getElementById("startScreen");
const overScreen = document.getElementById("overScreen");
const btnAgain = document.getElementById("btnAgain");
const btnMute = document.getElementById("btnMute");
const pauseChip = document.getElementById("pauseChip");
const live = document.getElementById("live");

const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
cvs.width = W * dpr; cvs.height = H * dpr;
ctx.scale(dpr, dpr);

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const store = {
  get best(){ return +(localStorage.getItem("mochi-best") || 0); },
  set best(v){ localStorage.setItem("mochi-best", v); },
  get muted(){ return localStorage.getItem("mochi-muted") === "1"; },
  set muted(v){ localStorage.setItem("mochi-muted", v ? "1" : "0"); }
};

// ---------- audio ----------
let AC = null, muted = store.muted;
function ac(){
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === "suspended") AC.resume();
  return AC;
}
function tone(f0, f1, dur, type = "sine", vol = 0.22, delay = 0){
  if (muted) return;
  try {
    const a = ac(), t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + 0.03);
  } catch (e) { /* audio unavailable */ }
}
const sfx = {
  flap(){ tone(460, 740, 0.09, "triangle", 0.16); },
  score(){ tone(880, 880, 0.08, "sine", 0.2); tone(1319, 1319, 0.16, "sine", 0.2, 0.07); },
  hit(){ tone(240, 55, 0.18, "square", 0.22); },
  thud(){ tone(150, 42, 0.15, "sine", 0.3); },
  over(){ tone(520, 200, 0.4, "triangle", 0.14, 0.15); }
};
function syncMuteBtn(){
  btnMute.textContent = muted ? "🔇" : "🔊";
  btnMute.setAttribute("aria-pressed", String(muted));
}
syncMuteBtn();
btnMute.addEventListener("click", (e) => {
  e.stopPropagation();
  muted = !muted; store.muted = muted; syncMuteBtn();
  if (!muted) sfx.flap();
});

// ---------- state ----------
let state = "ready"; // ready | play | dying | down | over
let paused = false;
let score = 0, best = store.best, scorePop = 0, isNewBest = false;
let scrollX = 0, tick = 0, shake = 0, flash = 0, overTimer = 0, tapLock = 0;
let speed = 2.2;

const bird = { y: 300, v: 0, angle: 0, phase: 0, flapAnim: 0, blinkIn: 140, blinkT: 0 };
let pipes = [], particles = [], popups = [], clouds = [], trees = [];
let distSinceSpawn = 0;

function gapSize(){ return Math.max(134, 154 - Math.floor(score / 5)); }
function speedNow(){ return 2.2 + Math.min(score * 0.035, 0.9); }

for (let i = 0; i < 6; i++) clouds.push({
  x: Math.random() * (W + 160) - 80, y: 40 + Math.random() * 190,
  s: 0.5 + Math.random() * 0.8, v: 0.15 + Math.random() * 0.25
});
for (let i = 0; i < 7; i++) trees.push({
  x: i * 90 + Math.random() * 50, s: 0.65 + Math.random() * 0.5, tone: Math.random() < 0.5
});

function resetRun(){
  score = 0; scorePop = 0; isNewBest = false;
  bird.y = 300; bird.v = 0; bird.angle = 0; bird.flapAnim = 0;
  pipes = []; particles = []; popups = [];
  distSinceSpawn = 0; speed = 2.2;
  shake = 0; flash = 0; overTimer = 0;
}

// ---------- particles ----------
function burst(x, y, n, colors, power = 3){
  if (reduceMotion) n = Math.min(n, 4);
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, sp = (0.4 + Math.random()) * power;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.4,
      rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3,
      life: 0, max: 40 + Math.random() * 30,
      size: 3 + Math.random() * 4,
      color: colors[i % colors.length], feather: true
    });
  }
}
function dust(x, y){
  for (let i = 0; i < (reduceMotion ? 3 : 8); i++){
    particles.push({
      x: x + (Math.random() - 0.5) * 24, y, vx: (Math.random() - 0.5) * 2.4, vy: -Math.random() * 1.6,
      rot: 0, vr: 0, life: 0, max: 26 + Math.random() * 14,
      size: 4 + Math.random() * 5, color: "#e9d3b3", feather: false
    });
  }
}
function puff(x, y){
  if (reduceMotion) return;
  for (let i = 0; i < 3; i++){
    particles.push({
      x, y, vx: -1.4 - Math.random(), vy: (Math.random() - 0.5) * 1.2,
      rot: Math.random() * 6.28, vr: 0.1, life: 0, max: 22,
      size: 2.5 + Math.random() * 2.5, color: "#fff3d1", feather: true
    });
  }
}

// ---------- game flow ----------
function flap(){
  bird.v = FLAP_V;
  bird.flapAnim = 1;
  bird.phase = 0;
  sfx.flap();
  puff(bird.x ?? BIRD_X, bird.y + 8);
}

function startPlay(){
  state = "play";
  startScreen.classList.add("hidden");
  flap();
  pipes.push(makePipe(W + 90, 300));
  distSinceSpawn = -70;
}

function makePipe(x, gapCenter){
  const g = gapSize();
  const minTop = 70, maxTop = GROUND_Y - 70 - g;
  const top = Math.max(minTop, Math.min(gapCenter - g / 2, maxTop));
  return { x, top, bottom: top + g, scored: false };
}

function die(byGround){
  if (state !== "play") return;
  state = "dying";
  bird.v = byGround ? 0 : Math.min(bird.v, -3.2);
  shake = reduceMotion ? 0 : 13;
  flash = 0.4;
  sfx.hit();
  burst(BIRD_X, bird.y, 9, ["#ffd75e", "#fff3d1", "#f7b23e"], 3.2);
  if (byGround) land();
}

function land(){
  state = "down";
  overTimer = 40;
  bird.y = GROUND_Y - BIRD_R;
  bird.v = 0;
  shake = Math.max(shake, reduceMotion ? 0 : 9);
  sfx.thud();
  dust(BIRD_X, GROUND_Y);
}

function showOver(){
  state = "over";
  tapLock = 30;
  if (score > best){ best = score; store.best = best; isNewBest = true; }
  document.getElementById("finalScore").textContent = score;
  document.getElementById("bestScore").textContent = best;
  document.getElementById("overSub").textContent = score === 0
    ? "The pipes won this round. Mochi is still round."
    : isNewBest ? "A personal best. Mochi is glowing." : "Ruffled feathers, but no regrets.";
  const row = document.getElementById("medalRow");
  row.innerHTML = "";
  const medal = score >= 40 ? ["Platinum", "#a8e6e0"] : score >= 30 ? ["Gold", "#ffc94d"]
    : score >= 20 ? ["Silver", "#c3cdd6"] : score >= 10 ? ["Bronze", "#d99a5f"] : null;
  if (medal){
    const el = document.createElement("span");
    el.className = "medal";
    el.innerHTML = `<span class="dot" style="background:${medal[1]}"></span>${medal[0]} medal`;
    row.appendChild(el);
  }
  if (isNewBest){
    const el = document.createElement("span");
    el.className = "medal newbest";
    el.textContent = "★ New best";
    row.appendChild(el);
  }
  overScreen.classList.remove("hidden");
  live.textContent = `Game over. Score ${score}. Best ${best}.`;
  setTimeout(() => btnAgain.focus({ preventScroll: true }), 60);
  sfx.over();
}

function restart(){
  resetRun();
  overScreen.classList.add("hidden");
  startScreen.classList.remove("hidden");
  state = "ready";
}

function primary(){
  if (paused){ setPaused(false); return; }
  if (state === "ready") startPlay();
  else if (state === "play") flap();
  else if (state === "over" && tapLock <= 0) restart();
}

function setPaused(p){
  if (p === paused) return;
  if (p && (state === "play" || state === "ready")){
    paused = true;
    pauseChip.classList.remove("hidden");
  } else if (!p){
    paused = false;
    pauseChip.classList.add("hidden");
    last = performance.now(); acc = 0;
  }
}

// ---------- input ----------
window.addEventListener("keydown", (e) => {
  if (["Space", "ArrowUp", "KeyW"].includes(e.code)){
    e.preventDefault();
    ac();
    primary();
  } else if (e.code === "KeyP"){
    setPaused(!paused);
  } else if (e.code === "KeyM"){
    btnMute.click();
  } else if (e.code === "Enter" && state === "over"){
    restart();
  }
});
shell.addEventListener("pointerdown", (e) => {
  if (e.target.closest("button")) return;
  ac();
  primary();
});
btnAgain.addEventListener("click", (e) => { e.stopPropagation(); restart(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) setPaused(true); });
window.addEventListener("blur", () => setPaused(true));

// ---------- update ----------
function update(){
  tick++;
  if (tapLock > 0) tapLock--;
  if (scorePop > 0) scorePop *= 0.86;
  if (shake > 0.2) shake *= 0.87; else shake = 0;
  if (flash > 0) flash *= 0.82;

  for (const p of particles){
    p.life++;
    p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    p.vy += p.feather ? 0.12 : 0.05;
    p.vx *= 0.98;
  }
  particles = particles.filter(p => p.life < p.max);
  for (const u of popups){ u.life++; u.y -= 0.9; }
  popups = popups.filter(u => u.life < u.max);

  bird.blinkIn--;
  if (bird.blinkIn <= 0){ bird.blinkT = 8; bird.blinkIn = 130 + Math.random() * 220; }
  if (bird.blinkT > 0) bird.blinkT--;

  const scrolling = state === "ready" || state === "play";
  if (scrolling){
    speed = state === "play" ? speedNow() : 2.2;
    scrollX += speed;
    for (const c of clouds){
      c.x -= c.v * (state === "ready" ? 0.6 : 1);
      if (c.x < -120) { c.x = W + 100 + Math.random() * 80; c.y = 40 + Math.random() * 190; }
    }
  }

  if (state === "ready"){
    bird.y = 300 + Math.sin(tick * 0.075) * 7;
    bird.angle = Math.sin(tick * 0.075) * 0.08;
    bird.phase += 0.12;
    bird.flapAnim *= 0.9;
  }

  if (state === "play"){
    bird.v = Math.min(bird.v + GRAV, MAX_FALL);
    bird.y += bird.v;
    if (bird.y < 14){ bird.y = 14; bird.v = Math.max(bird.v, 0.6); }

    const target = Math.max(-0.42, Math.min(1.25, bird.v * 0.085));
    bird.angle += (target - bird.angle) * 0.14;
    bird.phase += bird.flapAnim > 0.05 ? 0.34 : 0.1;
    bird.flapAnim *= 0.93;

    distSinceSpawn += speed;
    if (distSinceSpawn >= PIPE_SPACING){
      distSinceSpawn = 0;
      const lastPipe = pipes[pipes.length - 1];
      const prev = lastPipe ? lastPipe.top + gapSize() / 2 : 300;
      let gc = prev + (Math.random() - 0.5) * 230;
      gc = Math.max(120, Math.min(GROUND_Y - 120, gc));
      pipes.push(makePipe(W + 20, gc));
    }

    for (const p of pipes) p.x -= speed;
    pipes = pipes.filter(p => p.x + PIPE_W > -60);

    for (const p of pipes){
      if (!p.scored && p.x + PIPE_W < BIRD_X - BIRD_R){
        p.scored = true;
        score++; scorePop = 1;
        sfx.score();
        popups.push({ x: BIRD_X + 18, y: bird.y - 22, life: 0, max: 45 });
      }
      if (hits(BIRD_X, bird.y, BIRD_R - 3, p.x, -80, PIPE_W, p.top + 80) ||
          hits(BIRD_X, bird.y, BIRD_R - 3, p.x, p.bottom, PIPE_W, GROUND_Y - p.bottom + 80)){
        die(false);
        break;
      }
    }
    if (state === "play" && bird.y + BIRD_R >= GROUND_Y) die(true);
  }

  if (state === "dying"){
    bird.v = Math.min(bird.v + GRAV * 0.95, MAX_FALL);
    bird.y += bird.v;
    bird.angle += (1.65 - bird.angle) * 0.16;
    if (bird.y + BIRD_R >= GROUND_Y) land();
  }

  if (state === "down"){
    if (--overTimer <= 0) showOver();
  }
}

function hits(cx, cy, r, rx, ry, rw, rh){
  const nx = Math.max(rx, Math.min(cx, rx + rw));
  const ny = Math.max(ry, Math.min(cy, ry + rh));
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy < r * r;
}

// ---------- render ----------
function render(){
  ctx.save();
  if (shake > 0){
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }
  drawSky();
  drawSun();
  drawClouds();
  drawHills(scrollX * 0.18, 470, 52, 240, "#b7ddc4");
  drawHills(scrollX * 0.35, 505, 44, 170, "#8fd0a5");
  drawTrees();
  drawPipes();
  drawGround();
  drawParticles(false);
  drawBird();
  drawParticles(true);
  if (state === "play" || state === "dying") drawScore();
  for (const u of popups) drawPopup(u);
  if (flash > 0.01){
    ctx.fillStyle = `rgba(255,255,255,${flash})`;
    ctx.fillRect(-20, -20, W + 40, H + 40);
  }
  ctx.restore();
}

function drawSky(){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#a9d9f0");
  g.addColorStop(0.45, "#d9edf8");
  g.addColorStop(0.78, "#ffeeda");
  g.addColorStop(1, "#ffe3c8");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawSun(){
  const x = 318, y = 96, pulse = reduceMotion ? 0 : Math.sin(tick * 0.02) * 2.5;
  const g = ctx.createRadialGradient(x, y, 8, x, y, 58 + pulse);
  g.addColorStop(0, "rgba(255,244,196,0.95)");
  g.addColorStop(0.45, "rgba(255,240,190,0.4)");
  g.addColorStop(1, "rgba(255,240,190,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, 62 + pulse, 0, 7); ctx.fill();
  ctx.fillStyle = "#fff6cf";
  ctx.beginPath(); ctx.arc(x, y, 26, 0, 7); ctx.fill();
}

function cloudPuff(x, y, s){
  ctx.beginPath();
  ctx.arc(x, y, 16 * s, 0, 7);
  ctx.arc(x + 17 * s, y + 4 * s, 12 * s, 0, 7);
  ctx.arc(x - 17 * s, y + 5 * s, 11 * s, 0, 7);
  ctx.arc(x + 6 * s, y - 9 * s, 12 * s, 0, 7);
  ctx.fill();
}
function drawClouds(){
  ctx.fillStyle = "rgba(255,255,255,0.92)";
  for (const c of clouds){
    cloudPuff(c.x, c.y, c.s);
    if (c.x > W) cloudPuff(c.x - (W + 240), c.y, c.s);
  }
}

function drawHills(off, baseY, amp, wl, color){
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 5){
    const t = (x + off) / wl * Math.PI * 2;
    const y = baseY - amp * (0.5 + 0.5 * Math.sin(t)) - amp * 0.3 * (0.5 + 0.5 * Math.sin(t * 2.3 + 2));
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();
}

function drawTrees(){
  const off = scrollX * 0.6, worldW = 640;
  for (const t of trees){
    let x = ((t.x - off) % worldW + worldW) % worldW - 60;
    const s = t.s, baseY = 552;
    ctx.fillStyle = "#c69a6d";
    ctx.fillRect(x - 3 * s, baseY - 26 * s, 6 * s, 26 * s);
    ctx.fillStyle = t.tone ? "#5fb37f" : "#6dbd8a";
    ctx.beginPath();
    ctx.arc(x, baseY - 34 * s, 15 * s, 0, 7);
    ctx.arc(x - 11 * s, baseY - 26 * s, 11 * s, 0, 7);
    ctx.arc(x + 11 * s, baseY - 26 * s, 11 * s, 0, 7);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.16)";
    ctx.beginPath(); ctx.arc(x - 4 * s, baseY - 39 * s, 6 * s, 0, 7); ctx.fill();
  }
}

function drawPipes(){
  for (const p of pipes){
    drawPipe(p.x, -80, p.top + 80, true);
    drawPipe(p.x, p.bottom, GROUND_Y - p.bottom, false);
  }
}
function drawPipe(x, y, h, isTop){
  const g = ctx.createLinearGradient(x, 0, x + PIPE_W, 0);
  g.addColorStop(0, "#ffb3a2");
  g.addColorStop(0.3, "#ff9480");
  g.addColorStop(0.72, "#ff8169");
  g.addColorStop(1, "#e26d5a");
  ctx.fillStyle = g;
  roundRect(x, y, PIPE_W, h - (isTop ? 22 : 0) + (isTop ? 0 : 0), 8);
  ctx.fill();

  const capY = isTop ? y + h - 26 : y;
  const capH = 26, capX = x - 5, capW = PIPE_W + 10;
  ctx.fillStyle = g;
  roundRect(capX, capY, capW, capH, 9);
  ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.35)";
  roundRect(capX + 5, capY + 4, capW * 0.24, capH - 8, 5);
  ctx.fill();
  ctx.fillStyle = "rgba(226,109,90,0.5)";
  roundRect(capX + capW - 10, capY + 4, 5, capH - 8, 3);
  ctx.fill();
  ctx.fillStyle = "rgba(255,241,230,0.85)";
  if (isTop){ roundRect(capX + 2, capY + capH - 4, capW - 4, 3, 2); ctx.fill(); }
  else { roundRect(capX + 2, capY + 1, capW - 4, 3, 2); ctx.fill(); }
  ctx.fillStyle = "rgba(255,255,255,0.22)";
  ctx.fillRect(x + 6, isTop ? y : y + capH, 7, isTop ? h - 26 - (y > -79 ? 0 : 0) : h - capH);
}
function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
}

function drawGround(){
  ctx.fillStyle = "#e6c69b";
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, GROUND_Y + 14, W, H - GROUND_Y); ctx.clip();
  ctx.strokeStyle = "rgba(196,158,110,0.5)";
  ctx.lineWidth = 8;
  const off = scrollX % 42;
  for (let x = -60; x < W + 60; x += 42){
    ctx.beginPath();
    ctx.moveTo(x - off, H);
    ctx.lineTo(x - off + 34, GROUND_Y + 10);
    ctx.stroke();
  }
  ctx.restore();

  ctx.fillStyle = "#7cc796";
  ctx.fillRect(0, GROUND_Y, W, 16);
  ctx.fillStyle = "#6ab785";
  const goff = scrollX % 24;
  for (let x = -24; x < W + 24; x += 24){
    ctx.beginPath();
    ctx.arc(x - goff + 12, GROUND_Y + 2, 9, 0, Math.PI, true);
    ctx.fill();
  }
  ctx.fillStyle = "rgba(90,70,50,0.16)";
  ctx.fillRect(0, GROUND_Y + 16, W, 3);
}

function drawBird(){
  const dead = state === "dying" || state === "down" || state === "over";
  const x = BIRD_X, y = bird.y;
  const wingRot = dead ? 0.9 : Math.sin(bird.phase) * (0.4 + bird.flapAnim * 0.95) - bird.flapAnim * 0.55;

  ctx.save();
  ctx.translate(x, y);
  if (!dead || state === "dying") ctx.rotate(bird.angle);
  else ctx.rotate(Math.min(bird.angle, 1.5));

  ctx.fillStyle = "#f0b93f";
  ctx.beginPath(); ctx.ellipse(-15, -3, 9, 5.5, -0.35, 0, 7); ctx.fill();

  const bg = ctx.createRadialGradient(-4, -7, 3, 0, 0, 20);
  bg.addColorStop(0, "#ffe694");
  bg.addColorStop(1, "#ffc94d");
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.arc(0, 0, BIRD_R, 0, 7); ctx.fill();

  ctx.fillStyle = "#fff3d1";
  ctx.beginPath(); ctx.ellipse(2, 7, 10, 7.5, 0, 0, 7); ctx.fill();

  ctx.save();
  ctx.translate(-2, 1);
  ctx.rotate(wingRot);
  ctx.fillStyle = "#f7b23e";
  ctx.beginPath(); ctx.ellipse(-7, 2, 11, 6.5, -0.15, 0, 7); ctx.fill();
  ctx.fillStyle = "rgba(214,148,44,0.55)";
  ctx.beginPath(); ctx.ellipse(-9, 4, 7, 3.4, -0.15, 0, 7); ctx.fill();
  ctx.restore();

  if (dead){
    ctx.strokeStyle = "#4a3a2a";
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(7, -5, 4.5, 0.25 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    if (!reduceMotion){
      const sw = tick * 0.12;
      ctx.strokeStyle = "rgba(90,70,50,0.65)";
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      for (let a = 0; a < 5.4; a += 0.25){
        const r = 1 + a * 0.85;
        ctx.lineTo(2 + Math.cos(a + sw) * r, -22 + Math.sin(a + sw) * r);
      }
      ctx.stroke();
    }
  } else {
    const blink = bird.blinkT > 0;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(7, -6, 6.6, 0, 7); ctx.fill();
    if (blink){
      ctx.strokeStyle = "#4a3a2a"; ctx.lineWidth = 2; ctx.lineCap = "round";
      ctx.beginPath(); ctx.arc(7, -5, 4, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    } else {
      ctx.fillStyle = "#4a3a2a";
      ctx.beginPath(); ctx.arc(9, -6, 3.3, 0, 7); ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(10.3, -7.5, 1.25, 0, 7); ctx.fill();
    }
  }

  ctx.fillStyle = "rgba(255,157,157,0.55)";
  ctx.beginPath(); ctx.arc(3.5, 3.5, 3.6, 0, 7); ctx.fill();

  const open = dead ? 0 : bird.flapAnim * 0.35;
  ctx.fillStyle = "#ff9f68";
  ctx.beginPath();
  ctx.moveTo(11, -2); ctx.quadraticCurveTo(23, -1, 23, 2);
  ctx.quadraticCurveTo(23, 4, 11, 4); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#f2854f";
  ctx.save();
  ctx.translate(11, 4); ctx.rotate(open);
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.quadraticCurveTo(10, 1, 11, 2.4);
  ctx.quadraticCurveTo(6, 4.6, 0, 3); ctx.closePath(); ctx.fill();
  ctx.restore();

  ctx.restore();
}

function drawParticles(front){
  for (const p of particles){
    if (!!p.feather !== front) continue;
    const a = 1 - p.life / p.max;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    if (p.feather){
      ctx.beginPath(); ctx.ellipse(0, 0, p.size, p.size * 0.55, 0, 0, 7); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(0, 0, p.size * (1 - p.life / p.max * 0.5), 0, 7); ctx.fill();
    }
    ctx.restore();
  }
}

function drawScore(){
  const s = 1 + scorePop * 0.35;
  ctx.save();
  ctx.translate(W / 2, 76);
  ctx.scale(s, s);
  ctx.font = "800 46px 'Baloo 2', system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.lineJoin = "round";
  ctx.strokeStyle = "rgba(90,70,50,0.9)";
  ctx.lineWidth = 7;
  ctx.strokeText(score, 0, 0);
  ctx.fillStyle = "#fffaf0";
  ctx.fillText(score, 0, 0);
  ctx.restore();
}

function drawPopup(u){
  const a = 1 - u.life / u.max;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.font = "800 20px 'Baloo 2', system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.lineJoin = "round";
  ctx.strokeStyle = "rgba(90,70,50,0.8)";
  ctx.lineWidth = 5;
  ctx.strokeText("+1", u.x, u.y);
  ctx.fillStyle = "#ffe694";
  ctx.fillText("+1", u.x, u.y);
  ctx.restore();
}

// ---------- loop ----------
let last = performance.now(), acc = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(now - last, 120);
  last = now;
  if (!paused){
    acc += dt;
    let steps = 0;
    while (acc >= STEP && steps < 5){ update(); acc -= STEP; steps++; }
    if (steps === 5) acc = 0;
  }
  render();
}
requestAnimationFrame(frame);

if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render());
})();
</script>
</body>
