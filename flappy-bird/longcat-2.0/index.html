<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Flappy Bird</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Canvas size
        canvas.width = 400;
        canvas.height = 600;

        // Game state
        let gameState = 'start'; // start, playing, gameover
        let score = 0;
        let highScore = localStorage.getItem('flappyHighScore') || 0;
        let frameCount = 0;

        // Bird properties
        const bird = {
            x: 80,
            y: canvas.height / 2,
            width: 40,
            height: 30,
            velocity: 0,
            gravity: 0.4,
            flapStrength: -7,
            rotation: 0,
            flapFrame: 0
        };

        // Pipes
        let pipes = [];
        const pipeWidth = 60;
        const pipeGap = 150;
        const pipeSpeed = 2.5;
        let pipeTimer = 0;
        const pipeInterval = 90;

        // Parallax background layers
        let bgOffset1 = 0;
        let bgOffset2 = 0;
        let bgOffset3 = 0;
        const bgSpeed1 = 0.2;
        const bgSpeed2 = 0.5;
        const bgSpeed3 = 1;

        // Ground
        let groundOffset = 0;
        const groundSpeed = 2.5;
        const groundHeight = 80;

        // Clouds
        let clouds = [];
        for (let i = 0; i < 5; i++) {
            clouds.push({
                x: Math.random() * canvas.width,
                y: Math.random() * 200 + 50,
                size: Math.random() * 30 + 20,
                speed: Math.random() * 0.3 + 0.1
            });
        }

        // Particles for effects
        let particles = [];

        // Colors
        const colors = {
            sky: '#87CEEB',
            skyGradient: '#E0F7FA',
            ground: '#8B4513',
            groundLight: '#A0522D',
            pipe: '#2ECC71',
            pipeDark: '#27AE60',
            pipeHighlight: '#58D68D',
            birdBody: '#FFD93D',
            birdBelly: '#FFF176',
            birdWing: '#FFC107',
            birdEye: '#333',
            birdBeak: '#FF6B35',
            cloud: 'rgba(255, 255, 255, 0.8)',
            hill: '#66BB6A',
            hillDark: '#4CAF50'
        };

        // Draw gradient sky
        function drawSky() {
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height - groundHeight);
            gradient.addColorStop(0, '#87CEEB');
            gradient.addColorStop(0.5, '#B3E5FC');
            gradient.addColorStop(1, '#E1F5FE');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height - groundHeight);
        }

        // Draw clouds
        function drawClouds() {
            ctx.fillStyle = colors.cloud;
            clouds.forEach(cloud => {
                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, cloud.size, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.size * 0.8, cloud.y - cloud.size * 0.2, cloud.size * 0.7, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.size * 1.5, cloud.y, cloud.size * 0.8, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // Draw hills (parallax layer 1)
        function drawHills() {
            ctx.fillStyle = colors.hill;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - groundHeight);
            for (let x = 0; x <= canvas.width; x += 5) {
                const y = canvas.height - groundHeight - 30 - Math.sin((x + bgOffset1) * 0.02) * 25 - Math.sin((x + bgOffset1) * 0.01) * 15;
                ctx.lineTo(x, y);
            }
            ctx.lineTo(canvas.width, canvas.height - groundHeight);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = colors.hillDark;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - groundHeight);
            for (let x = 0; x <= canvas.width; x += 5) {
                const y = canvas.height - groundHeight - 15 - Math.sin((x + bgOffset2) * 0.015 + 1) * 20;
                ctx.lineTo(x, y);
            }
            ctx.lineTo(canvas.width, canvas.height - groundHeight);
            ctx.closePath();
            ctx.fill();
        }

        // Draw ground
        function drawGround() {
            // Main ground
            const groundGradient = ctx.createLinearGradient(0, canvas.height - groundHeight, 0, canvas.height);
            groundGradient.addColorStop(0, '#8BC34A');
            groundGradient.addColorStop(0.3, '#7CB342');
            groundGradient.addColorStop(1, '#558B2F');
            ctx.fillStyle = groundGradient;
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);

            // Ground detail lines
            ctx.strokeStyle = '#689F38';
            ctx.lineWidth = 2;
            for (let x = -groundOffset % 30; x < canvas.width; x += 30) {
                ctx.beginPath();
                ctx.moveTo(x, canvas.height - groundHeight + 10);
                ctx.lineTo(x + 15, canvas.height - groundHeight + 25);
                ctx.stroke();
            }

            // Grass tufts
            ctx.fillStyle = '#9CCC65';
            for (let x = -groundOffset % 40; x < canvas.width; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, canvas.height - groundHeight);
                ctx.lineTo(x + 5, canvas.height - groundHeight - 10);
                ctx.lineTo(x + 10, canvas.height - groundHeight);
                ctx.fill();
            }
        }

        // Draw pipe
        function drawPipe(pipe) {
            const capHeight = 25;
            const capOverhang = 8;

            // Top pipe body
            const topGradient = ctx.createLinearGradient(pipe.x, 0, pipe.x + pipeWidth, 0);
            topGradient.addColorStop(0, colors.pipeDark);
            topGradient.addColorStop(0.3, colors.pipeHighlight);
            topGradient.addColorStop(0.5, colors.pipe);
            topGradient.addColorStop(0.7, colors.pipeHighlight);
            topGradient.addColorStop(1, colors.pipeDark);
            ctx.fillStyle = topGradient;
            ctx.fillRect(pipe.x, 0, pipeWidth, pipe.topHeight);

            // Top pipe cap
            ctx.fillStyle = colors.pipeDark;
            ctx.fillRect(pipe.x - capOverhang, pipe.topHeight - capHeight, pipeWidth + capOverhang * 2, capHeight);
            ctx.fillStyle = colors.pipeHighlight;
            ctx.fillRect(pipe.x - capOverhang + 3, pipe.topHeight - capHeight + 3, pipeWidth + capOverhang * 2 - 6, 5);

            // Bottom pipe body
            const bottomY = pipe.topHeight + pipeGap;
            ctx.fillStyle = topGradient;
            ctx.fillRect(pipe.x, bottomY, pipeWidth, canvas.height - bottomY - groundHeight);

            // Bottom pipe cap
            ctx.fillStyle = colors.pipeDark;
            ctx.fillRect(pipe.x - capOverhang, bottomY, pipeWidth + capOverhang * 2, capHeight);
            ctx.fillStyle = colors.pipeHighlight;
            ctx.fillRect(pipe.x - capOverhang + 3, bottomY + 3, pipeWidth + capOverhang * 2 - 6, 5);
        }

        // Draw cute bird
        function drawBird() {
            ctx.save();
            ctx.translate(bird.x + bird.width / 2, bird.y + bird.height / 2);
            ctx.rotate(bird.rotation);

            // Wing animation
            const wingOffset = Math.sin(bird.flapFrame * 0.3) * 5;

            // Body
            ctx.fillStyle = colors.birdBody;
            ctx.beginPath();
            ctx.ellipse(0, 0, bird.width / 2, bird.height / 2, 0, 0, Math.PI * 2);
            ctx.fill();

            // Belly
            ctx.fillStyle = colors.birdBelly;
            ctx.beginPath();
            ctx.ellipse(2, 3, bird.width / 3, bird.height / 3, 0, 0, Math.PI * 2);
            ctx.fill();

            // Wing
            ctx.fillStyle = colors.birdWing;
            ctx.beginPath();
            ctx.ellipse(-5, wingOffset, 12, 8, -0.3, 0, Math.PI * 2);
            ctx.fill();

            // Eye white
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(10, -5, 8, 0, Math.PI * 2);
            ctx.fill();

            // Eye
            ctx.fillStyle = colors.birdEye;
            ctx.beginPath();
            ctx.arc(12, -5, 4, 0, Math.PI * 2);
            ctx.fill();

            // Eye shine
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(13, -6, 1.5, 0, Math.PI * 2);
            ctx.fill();

            // Blush
            ctx.fillStyle = 'rgba(255, 150, 150, 0.5)';
            ctx.beginPath();
            ctx.ellipse(5, 5, 5, 3, 0, 0, Math.PI * 2);
            ctx.fill();

            // Beak
            ctx.fillStyle = colors.birdBeak;
            ctx.beginPath();
            ctx.moveTo(18, 0);
            ctx.lineTo(28, 3);
            ctx.lineTo(18, 6);
            ctx.closePath();
            ctx.fill();

            // Tail
            ctx.fillStyle = colors.birdWing;
            ctx.beginPath();
            ctx.moveTo(-18, -5);
            ctx.lineTo(-28, 0);
            ctx.lineTo(-18, 5);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        // Draw particles
        function drawParticles() {
            particles.forEach((p, index) => {
                ctx.fillStyle = `rgba(${p.color}, ${p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.02;
                p.size *= 0.98;
                if (p.alpha <= 0) particles.splice(index, 1);
            });
        }

        // Create flap particles
        function createFlapParticles() {
            for (let i = 0; i < 3; i++) {
                particles.push({
                    x: bird.x,
                    y: bird.y + bird.height / 2,
                    vx: -Math.random() * 2 - 1,
                    vy: Math.random() * 2 - 1,
                    size: Math.random() * 4 + 2,
                    alpha: 0.6,
                    color: '255, 217, 61'
                });
            }
        }

        // Draw score
        function drawScore() {
            ctx.fillStyle = 'white';
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.lineWidth = 4;
            ctx.font = 'bold 48px Segoe UI';
            ctx.textAlign = 'center';
            ctx.strokeText(score, canvas.width / 2, 70);
            ctx.fillText(score, canvas.width / 2, 70);
        }

        // Draw start screen
        function drawStartScreen() {
            // Overlay
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Title card
            ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            roundRect(50, 150, 300, 200, 20);
            ctx.fill();

            // Title
            ctx.fillStyle = '#FF6B35';
            ctx.font = 'bold 36px Segoe UI';
            ctx.textAlign = 'center';
            ctx.fillText('Flappy Bird', canvas.width / 2, 200);

            // Cute bird icon
            ctx.fillStyle = colors.birdBody;
            ctx.beginPath();
            ctx.arc(canvas.width / 2, 245, 25, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = colors.birdBelly;
            ctx.beginPath();
            ctx.arc(canvas.width / 2 + 3, 248, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(canvas.width / 2 + 10, 240, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = colors.birdEye;
            ctx.beginPath();
            ctx.arc(canvas.width / 2 + 11, 240, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = colors.birdBeak;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2 + 16, 245);
            ctx.lineTo(canvas.width / 2 + 26, 248);
            ctx.lineTo(canvas.width / 2 + 16, 251);
            ctx.closePath();
            ctx.fill();

            // Instructions
            ctx.fillStyle = '#666';
            ctx.font = '18px Segoe UI';
            ctx.fillText('Tap or press SPACE to flap', canvas.width / 2, 300);
            ctx.fillText('Avoid the pipes!', canvas.width / 2, 325);

            // High score
            if (highScore > 0) {
                ctx.fillStyle = '#FF6B35';
                ctx.font = 'bold 16px Segoe UI';
                ctx.fillText(`Best: ${highScore}`, canvas.width / 2, 365);
            }

            // Pulsing start text
            const pulse = Math.sin(frameCount * 0.05) * 0.2 + 0.8;
            ctx.fillStyle = `rgba(46, 204, 113, ${pulse})`;
            ctx.font = 'bold 22px Segoe UI';
            ctx.fillText('Click to Start', canvas.width / 2, 420);
        }

        // Draw game over screen
        function drawGameOverScreen() {
            // Overlay
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Game over card
            ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            roundRect(50, 180, 300, 220, 20);
            ctx.fill();

            // Title
            ctx.fillStyle = '#E74C3C';
            ctx.font = 'bold 32px Segoe UI';
            ctx.textAlign = 'center';
            ctx.fillText('Game Over', canvas.width / 2, 225);

            // Score
            ctx.fillStyle = '#333';
            ctx.font = '20px Segoe UI';
            ctx.fillText('Score', canvas.width / 2, 265);
            ctx.fillStyle = '#FF6B35';
            ctx.font = 'bold 48px Segoe UI';
            ctx.fillText(score, canvas.width / 2, 310);

            // High score
            ctx.fillStyle = '#666';
            ctx.font = '16px Segoe UI';
            ctx.fillText(`Best: ${highScore}`, canvas.width / 2, 345);

            // New high score badge
            if (score >= highScore && score > 0) {
                ctx.fillStyle = '#FFD700';
                ctx.font = 'bold 14px Segoe UI';
                ctx.fillText('NEW BEST!', canvas.width / 2, 370);
            }

            // Restart button
            ctx.fillStyle = '#2ECC71';
            roundRect(canvas.width / 2 - 80, 385, 160, 40, 20);
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.font = 'bold 18px Segoe UI';
            ctx.fillText('Play Again', canvas.width / 2, 410);
        }

        // Rounded rectangle helper
        function roundRect(x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        // Reset game
        function resetGame() {
            bird.y = canvas.height / 2;
            bird.velocity = 0;
            bird.rotation = 0;
            bird.flapFrame = 0;
            pipes = [];
            particles = [];
            score = 0;
            pipeTimer = 0;
            frameCount = 0;
        }

        // Flap
        function flap() {
            if (gameState === 'start') {
                gameState = 'playing';
                resetGame();
            }
            if (gameState === 'playing') {
                bird.velocity = bird.flapStrength;
                bird.flapFrame = 0;
                createFlapParticles();
            }
            if (gameState === 'gameover') {
                gameState = 'start';
                resetGame();
            }
        }

        // Check collision
        function checkCollision() {
            // Ground and ceiling
            if (bird.y + bird.height > canvas.height - groundHeight || bird.y < 0) {
                return true;
            }

            // Pipes
            for (let pipe of pipes) {
                if (bird.x + bird.width - 10 > pipe.x && bird.x + 10 < pipe.x + pipeWidth) {
                    if (bird.y + 5 < pipe.topHeight || bird.y + bird.height - 5 > pipe.topHeight + pipeGap) {
                        return true;
                    }
                }
            }
            return false;
        }

        // Update game
        function update() {
            frameCount++;

            // Update parallax backgrounds
            bgOffset1 += bgSpeed1;
            bgOffset2 += bgSpeed2;
            bgOffset3 += bgSpeed3;

            // Update clouds
            clouds.forEach(cloud => {
                cloud.x -= cloud.speed;
                if (cloud.x + cloud.size * 2 < 0) {
                    cloud.x = canvas.width + cloud.size;
                    cloud.y = Math.random() * 200 + 50;
                }
            });

            if (gameState === 'playing') {
                // Bird physics
                bird.velocity += bird.gravity;
                bird.y += bird.velocity;
                bird.flapFrame++;

                // Bird rotation based on velocity
                bird.rotation = Math.min(Math.max(bird.velocity * 0.05, -0.5), 1.5);

                // Ground scroll
                groundOffset += groundSpeed;

                // Pipe spawning
                pipeTimer++;
                if (pipeTimer >= pipeInterval) {
                    pipeTimer = 0;
                    const minHeight = 80;
                    const maxHeight = canvas.height - groundHeight - pipeGap - minHeight;
                    const topHeight = Math.random() * maxHeight + minHeight;
                    pipes.push({
                        x: canvas.width,
                        topHeight: topHeight,
                        passed: false
                    });
                }

                // Update pipes
                pipes.forEach(pipe => {
                    pipe.x -= pipeSpeed;

                    // Score
                    if (!pipe.passed && pipe.x + pipeWidth < bird.x) {
                        pipe.passed = true;
                        score++;
                    }
                });

                // Remove off-screen pipes
                pipes = pipes.filter(pipe => pipe.x + pipeWidth > 0);

                // Check collision
                if (checkCollision()) {
                    gameState = 'gameover';
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem('flappyHighScore', highScore);
                    }
                }
            }
        }

        // Draw everything
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawSky();
            drawClouds();
            drawHills();

            // Draw pipes
            pipes.forEach(pipe => drawPipe(pipe));

            drawGround();
            drawBird();
            drawParticles();

            if (gameState === 'playing') {
                drawScore();
            } else if (gameState === 'start') {
                drawStartScreen();
            } else if (gameState === 'gameover') {
                drawScore();
                drawGameOverScreen();
            }
        }

        // Game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Event listeners
        canvas.addEventListener('click', flap);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            flap();
        });
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                flap();
            }
        });

        // Start game loop
        gameLoop();
    </script>
</body>
</html>
